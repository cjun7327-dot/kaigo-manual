行う前に、以下の設定を行ってください。 \nイ) 居宅介護支援事業所設定・・  8 ページ \nロ) 連携設定・・・・・・・・・ 10 ページ \nハ) 管理設定・・・・・・・・・ 14 ページ \n \n \nイ）居宅介護支援事業所設定【必須】 \n1. メイン画面の「設定」をクリックし、「居宅介護支援事業所設定」を開きます。 \n \n \n \n \n \n \n \n \n \n \n \n2. ケアプランデータの連携先となる居宅介護支援事業所、地域包括支援センターを選択し、 \n「訂正」をクリックします。 \n※ 居宅介護支援事業所、地域包括支援センターを新しく登録する場合は、\n「新規」をクリックし、 \n事業所の情報を入力します。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n→次ページに続く \n \n居宅介護支援事業所設定を \nクリックします。 \n②「訂正」をクリックします。 \n① データの連携先となる \n事業所を選択します。 \n※ 居宅介護支援事業所、地域包括支援センターを \n新しく登録する場合は、「新規」をクリックし \n事業所の情報を入力します。", "images": ["images/ラベンダー__p8.png"]}, {"id": "ラベンダー__page9", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 9, "text": "Copyright (C) 2026 conduct Corporation                                               page 9/32 \n \n3.「ケアプランデータ連携の対象にする」にチェックを入れ、「登録」をクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n4. 「連」に「〇」が表示されたことを確認します。 \n※「ケアプランデータ連携の対象にする」にチェックがある事業所は「〇」が表示されます。 \n※ ケアプランデータの連携先となる事業所が複数ある場合は、手順2～4 を繰り返します。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n①「ケアプランデータ連携の対象にする」 \nにチェックを入れます。 \n②「登録」をクリックします。 \n「連」に「〇」が表示されたことを \n確認します。 \n＜同法人系列の居宅介護支援事業所等でFlowersNEXT システムを使用しているお客様へ＞ \n保険請求予実の「予定取り込み」や介護計画書の「サービス計画取り込み」を使用し、 \nすでに情報の連携を行っている居宅介護支援事業所、地域包括支援センターについては、 \n「ケアプランデータ連携の対象にする」にチェックを入れないでください。", "images": ["images/ラベンダー__p9.png"]}, {"id": "ラベンダー__page10", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 10, "text": "Copyright (C) 2026 conduct Corporation                                               page 10/32 \n \nロ）連携設定 \n1.  メイン画面上部の外部データ連携＞「ケアプランデータ連携」を \nクリックします。 \n2.  連携メニューが表示されますので、「ケアプランデータ連携設定」をクリックします。 \n3.  ①～⑤の内容について、設定を行います。（次ページ以降をご覧ください。） \n4. 「登録」をクリックし、画面を閉じます。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n① \n② \n③【必須】 \n⑤【必須】 \n④", "images": ["images/ラベンダー__p10.png"]}, {"id": "ラベンダー__page11", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 11, "text": "Copyright (C) 2026 conduct Corporation                                               page 11/32 \n \n ①「出力したＣＳＶを事業所番号ごとに振り分ける」  \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n→次ページに続く \n \n \nチェックなし \n１つのフォルダにすべてのＣＳＶファイルが出力されます。 \n※ ケアプランデータ連携システムを使用してＣＳＶファイルを送信する場合は、チェックなしで \nお使いください。 \n \n \nチェックあり \n居宅介護支援事業所、地域包括支援センターごとにそれぞれ別のフォルダに振り分けられます。 \n※ ケアプラン事業所ごとにメール等でＣＳＶファイルを送信する場合は、チェックありでお使い \nください。 \n \n \n \n \n \n＜フォルダ名の設定＞ \nフォルダ名の付け方を４種類から選択することができます。 \n※「出力したＣＳＶを事業所ごとに振り分ける」にチェックが入っている場合のみ選択できます。 \n \n \n事業所A \nＣＳＶ \n事業所B  \nＣＳＶ \nフォルダ \n事業所C  \nＣＳＶ \n事業所A \nＣＳＶ \n \n事業所番号A フォルダ \n事業所B \nＣＳＶ \n \n事業所番号B フォルダ \n事業所C \nＣＳＶ \n \n事業所番号C フォルダ \nフォルダ名の付け方を選択できます。 \n※「出力したＣＳＶを事業所ごとに振り分ける」に \nチェックが入っている場合のみ選択できます。", "images": ["images/ラベンダー__p11.png"]}, {"id": "ラベンダー__page12", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 12, "text": "Copyright (C) 2026 conduct Corporation                                               page 12/32 \n \n ②「削除ファイルを出力する」  \n実績の取消を削除ファイルの連携によって行う場合は、チェックを入れてください。（任意） \n※ 基本的には「チェックなし」でお使いください。 \n \n \n \n \n \n \n \n ③「同一事業所番号の実績をまとめて出力する」 【必須】 \nチェックを入れてください。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n→次ページに続く \n \n \nこの設定にチェックを入れると、ＣＳＶファイルの出力後に保険請求実績を削除した場合に、 \n実績の削除情報を出力することができます。 \n※ 実績の取り消しは、今まで通りの連絡手段（電話・メール・FAX 等）でも行えます。 \nチェックを入れることで、同一法人(同じ事業所番号)でFlowersNEXT システムを使用している \n場合に、他システム分を含むすべての実績が１つのファイル(ケアプラン事業所ごと)にまとまる\nようになります。 \n（例）すみれとあさがおⅠを使用している場合 \n \n \n居宅介護支援事業所X のCSV \n・利用者A の訪問介護分 \n・利用者A の通所介護分 \n・利用者B の通所介護分 \n・利用者C の訪問介護分 \n居宅介護支援事業所Y のCSV \n・利用者D の訪問介護分 \n・利用者E の通所介護分 \n居宅介護支援事業所Z のCSV \n・利用者F の訪問介護分", "images": ["images/ラベンダー__p12.png"]}, {"id": "ラベンダー__page13", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 13, "text": "Copyright (C) 2026 conduct Corporation                                               page 13/32 \n \n ④「ＣＳＶファイル取込元」  \n居宅介護支援事業所、地域包括支援センターから受け取ったＣＳＶファイルを取込するときの参照先\nフォルダ(取込元)を設定します。 \n基本的には、初期値である『C:\\CONDUCT_SAVEDATA\\標準連携\\取込\\』※のままお使いください。 \n※ Flowers NEXT on Cloud をお使いの場合：『\\\\tsclient\\C\\CONDUCT_SAVEDATA\\標準連携\\取込\\』 \n \nなお、「ＣＳＶファイル取込元」フォルダ内に置かれているすべてのＣＳＶファイルが取込の対象と\nなりますので、ご注意ください。 \n \n【注意】 \n「ＣＳＶファイル取込元」は、「ＣＳＶファイル出力先」と同じフォルダにしないでください！ \n \n \n \n ⑤「取り込んだＣＳＶを自動で移動させる」 【必須】 \nチェックを入れてください。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nこの設定は、 ④「ＣＳＶファイル取込元」 で設定したフォルダの中のＣＳＶファイルを、データ\n取込を行うたびに別のフォルダに移動させるためのものです。 \n※データ取込を行うたびに「ＣＳＶファイル取込元」フォルダ内に「取込日時」のフォルダが \n自動的に作成され、ＣＳＶファイルは「ＣＳＶファイル取込元」フォルダから、「取込日時」フォルダ\nの中に移動します。 \n \n居宅A \nＣＳＶ \n居宅B  \nＣＳＶ \nフォルダ \n居宅C  \nＣＳＶ \nフォルダ \n居宅A \nＣＳＶ \n居宅B  \nＣＳＶ \n居宅C  \nＣＳＶ \nフォルダ  (例)フォルダ名:20230424093000 \n \n自動的に別のフォルダに移動 \n取り込み \nケアプランの", "images": ["images/ラベンダー__p13.png"]}, {"id": "ラベンダー__page14", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 14, "text": "Copyright (C) 2026 conduct Corporation                                               page 14/32 \n \nハ）管理設定 \n管理設定※について、以下の手順を行ってください。 \n※ メイン画面＞システム動作環境＞管理設定 \n \n1. 表示されている事業所番号が正しいことを確認します。 \n2. サテライト事業所としてシステムを利用されている場合は、枝番を入力します。 \n3. 登録をクリックし、画面を閉じます。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1. 事業所番号が正しいことを \n確認します。 \n2. サテライト事業所の場合、\n枝番を入力します。 \n3. 登録をクリックし、 \n画面を閉じます。", "images": ["images/ラベンダー__p14.png"]}, {"id": "ラベンダー__page15", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 15, "text": "Copyright (C) 2026 conduct Corporation                                               page 15/32 \nIII. \nシステムの操作方法 \n \nイ) 居宅介護支援事業所、地域包括支援センターから受け取ったケアプランデータを取込する \n 居宅サービス計画書(１)(２)(３)  、 介護予防サービス支援計画表、利用者基本情報  、 \n サービス提供票  のＣＳＶファイルを取込します。 \n居宅サービス計画書(１)(２)は「計画書」へ、サービス提供票は「保険請求予定」へそれぞれ取り込む \nことができます。 \n※ 居宅サービス計画書(３)、予防サービス支援計画表、利用者基本情報は取り込み先はありません。 \n（印刷機能のみ） \n→16 ページ \nロ) 居宅介護支援事業所、地域包括支援センターから受け取ったケアプランの内容を確認する \n 居宅サービス計画書(１)(２)(３)  、 介護予防サービス支援計画表、利用者基本情報  、 \n サービス提供票  の内容を確認します。 \n \n→22 ページ \n \nハ) 実績を出力する \n 保険請求実績  をＣＳＶファイルとして出力し、出力したファイルを居宅介護支援事業所、 \n地域包括支援センターへ送信します。 \n→24 ページ \n \n \n \n  【注意】ＣＳＶファイルの出力や取込は、なるべく１台のパソコンで行ってください。", "images": ["images/ラベンダー__p15.png"]}, {"id": "ラベンダー__page16", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 16, "text": "Copyright (C) 2026 conduct Corporation                                               page 16/32 \nイ）居宅介護支援事業所、地域包括支援センターから受け取ったケアプランを取込する \n 居宅サービス計画書(１)(２)(３)  、 介護予防サービス支援計画表、利用者基本情報  、 \n サービス提供票  のＣＳＶファイルを取込します。 \n \n＜事前準備＞ \n居宅介護支援事業所、地域包括支援センターから受け取ったすべてのＣＳＶファイルを、 \n「ＣＳＶファイル取込元」フォルダ※の直下に保存します。 \n※  ④「ＣＳＶファイル取込元」(13 ページ)で設定済みのフォルダ \n【注意】「ＣＳＶファイル取込元」フォルダの直下に保存されていないファイルは取込の対象外となります。 \n \n \n \n \n \n \n \n \n \n \n \n \n＜操作方法＞ \n1.  メイン画面の外部データ連携＞「ケアプランデータ連携」をクリックします。 \n2. 「サービス計画・提供票データの取り込み」をクリックします。 \n \n \n \n \n \n \n \n \n \n \n※ 以下のメッセージが表示された場合は、「ＯＫ」をクリックし、 ④「ＣＳＶファイル取込元」 (13 ページ) \nをご覧いただき、設定を行ってください。 \n \n \n \n「ＣＳＶファイル取込元」に設定したフォルダのショートカットをデスクトップに作成しておくと、 \n居宅介護支援事業所から送られてきたＣＳＶファイルを、簡単に「ＣＳＶファイル取込元」フォルダ\nに保存することができるので便利です。 \n2025/04/25 16:30     Microsoft Excel CS…         1 KB  \n2025/04/25 16:30     Microsoft Excel CS…         1 KB \n2025/04/25 16:30     Microsoft Excel CS…         1 KB \n UPPLAN_202504_1234567890_43_9876543210_11_20250425163015.CSV \nUPHOSOKU_202504_1234567890_43_9876543210_11_20250425163015.CSV \nUPSIKYU_202504_1234567890_43_9876543210_11_20250425163015.CSV \n「ＣＳＶファイル取込元」フォルダの直下に \n 受け取ったＣＳＶファイルを保存します。 \n参照先のフォルダが存在しません。 \nケアプランデータ連携設定にてＣＳＶ取込設定を行ってください。 「ＯＫ」をクリックします。 \n「サービス計画・提供票データの取り込み」 \nをクリックします。", "images": ["images/ラベンダー__p16.png"]}, {"id": "ラベンダー__page17", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 17, "text": "Copyright (C) 2026 conduct Corporation                                               page 17/32 \n \n3. 画面上にＣＳＶファイルの情報が表示されます。内容を確認し、「取込開始」をクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n4.  取込を行う利用者の「選択」欄にチェックを入れ、「決定」をクリックします。 \n※ 全ての利用者を取込する場合は、「全選択」をクリックし、「決定」をクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n「ＣＳＶ種類」や「送信元事業所」から、表示される利用者を絞り込むことができます。 \n※ 全ての利用者を取込する場合は、 \n「全選択」をクリックします。 \n① 取り込みを行う利用者に \nチェックを入れます。 \n②「決定」を \nクリックします。\n13\n① 絞り込み条件を選択しま     } catch(e) {}

    const sidebar = document.getElementById('sidebar');

        sidebar.classList.remove('open');
        overlay.style.display = 'none';
    } else {
        sidebar.classList.add('open');
        overlay.style.display = 'block';
    }
}

}

function saveCallMemo() {

        else matchSoft = itemSoft.includes(selectedSoftware) || selectedSoftware.includes(itemSoft);

        if (!matchSoft) return;

        const specialSoftwares = ['介護ASP', '絆マニュアル', 'ナーシングネットプラスワン', 'カイポケ', 'ラベンダー'];
        if (specialSoftwares.includes(itemSoft)) {
            if ((selectedSoftware === itemSoft || selectedSoftware.startsWith(itemSoft)) || (selectedSoftware === 'ALL' && keywords.some(k => itemSoft.toLowerCase().includes(k)))) {
                filtered.push(item); return; 
            }
        }
        if (keywords.length === 0) { filtered.push(item); return; }
        if (keywords.every(k => itemText.includes(k) || itemCategory.includes(k) || itemSoft.toLowerCase().includes(k))) filtered.push(item);
    });

    // 重複除去
    const uniqueFiltered = [];
    const seenInstances = new Set();
    filtered.forEach(item => {
        const key = item.instanceId || item.id;
        if (!seenInstances.has(key)) { seenInstances.add(key); uniqueFiltered.push(item); }
    });
    filtered = uniqueFiltered;

    if (filtered.length === 0) {
        resultsContainer.innerHTML = '<p style="text-align:center; color:#666; font-size:16px;">該当するマニュアルページが見つかりませんでした。</p>';
        return;
    }

    resultsContainer.innerHTML = `<p style="color:#1a73e8; margin-bottom:10px; font-weight:bold; font-size:14px;">検索結果: ${filtered.length} 件表示中</p>`;

    let bannerCount = 0;
    
    // モーダルスワイプ用の配列作成
    filtered.forEach(item => {
        if (item.images && item.images.length > 0) {
            item.images.forEach(imgSrc => currentModalImages.push(imgSrc));
        }
    });

    let imgGlobalIndex = 0;

    filtered.forEach((item, index) => {
        if (item.groupHeader) {
            bannerCount++;
            const bannerId = `banner_heading_${bannerCount}`;
            const banner = document.createElement('div');
            banner.className = 'section-banner';
            banner.id = bannerId;
            banner.innerHTML = `📌 ${item.groupHeader.replace(/\n/g, '<br>📌 ')}`;
            resultsContainer.appendChild(banner);

            const navBtn = document.createElement('button');
            navBtn.className = 'sidebar-menu-btn';
            navBtn.innerText = `▶ ${item.groupHeader.replace(/【|】|📌 /g, '').replace(/\n/g, ' / ')}`;
            navBtn.onclick = () => { toggleSidebar(); document.getElementById(bannerId).scrollIntoView({ behavior: 'smooth' }); };
            quickNavContainer.appendChild(navBtn);
        }

        const card = document.createElement('div');
        card.className = 'result-card';
        card.id = `card_${index}`;
        
        let imagesHtml = '';
        if (item.images && item.images.length > 0) {
            imagesHtml = '<div class="image-container">' + 
                item.images.map(imgSrc => {
                    let html = `<img src="${imgSrc}" class="result-img" onclick="openModal(${imgGlobalIndex})" title="タップで拡大表示">`;
                    imgGlobalIndex++;
                    return html;
                }).join('') + 
                '</div>';
        }

        let categoryBadge = item.category ? `<span class="category-badge">【${item.category}】</span>` : '';
        let pageText = `ページ: ${item.page}`;
        if (item.displayImgPage) pageText = `PDF: ${item.page} (印字: ${item.displayImgPage}p)`;

        let officialCommentHtml = '';
        const commentId = item.id || item.instanceId;
        if (sharedComments[commentId]) {
            officialCommentHtml = `
            <div class="official-comment">
                <span class="official-comment-title">💡 公式手順・注意事項</span>
                ${sharedComments[commentId]}
            </div>`;
        }

        const prevDisabled = index === 0 ? 'disabled' : '';
        const nextDisabled = index === filtered.length - 1 ? 'disabled' : '';
        const stepNavHtml = `
            <div class="step-nav-container">
                <button class="step-btn" ${prevDisabled} onclick="scrollToCard(${index - 1})">⬅ 前の手順</button>
                <span style="font-size:12px; font-weight:bold; color:#666; align-self:center;">${index + 1} / ${filtered.length}</span>
                <button class="step-btn" ${nextDisabled} onclick="scrollToCard(${index + 1})">次の手順 ➔</button>
            </div>
        `;

        const memoKey = item.instanceId || item.id;
        let savedMemo = '';
        try { savedMemo = localStorage.getItem('memo_' + memoKey) || ''; } catch(e) {}

        card.innerHTML = `
            <div><span class="software-badge">${item.software}</span>${categoryBadge} <span style="color:#666; font-size:12px; font-weight:bold;">（${pageText}）</span></div>
            ${imagesHtml}
            ${officialCommentHtml}
            ${stepNavHtml}
            <div class="memo-container">
                <label class="memo-label">📝 個人用メモ（自動保存）</label>
                <textarea id="memo_${memoKey}" class="memo-textarea" placeholder="メモを入力..." oninput="saveMemo('${memoKey}')">${savedMemo}</textarea>
            </div>
        `;
        resultsContainer.appendChild(card);
    });
}

function saveMemo(id) {
    try { localStorage.setItem('memo_' + id, document.getElementById('memo_' + id).value); } catch(e) {}
}

/* --- モーダル・スワイプ・ピンチズーム機能 --- */
let currentScale = 1;
let lastTapTime = 0;
let initialDistance = 0;
let touchStartX = 0;
let touchEndX = 0;

function setupModalZoomAndSwipe() {
    const modalImg = document.getElementById('modalImage');
    
    modalImg.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            touchStartX = e.changedTouches[0].screenX;
        } else if (e.touches.length === 2) {
            initialDistance = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
        }
    });

    modalImg.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
            e.preventDefault();
            const currentDistance = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
            const factor = currentDistance / initialDistance;
            let newScale = currentScale * factor;
            if (newScale >= 1 && newScale <= 4) {
                modalImg.style.transform = `scale(${newScale})`;
            }
        }
    });

    modalImg.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) {
            const transform = modalImg.style.transform;
            if (transform.includes('scale')) {
                const match = transform.match(/scale\(([^)]+)\)/);
                if (match) currentScale = parseFloat(match[1]);
            }
        }
        
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;
        if (tapLength < 300 && tapLength > 0 && e.changedTouches.length === 1) {
            e.preventDefault();
            if (currentScale > 1) { currentScale = 1; } else { currentScale = 2.5; }
            modalImg.style.transform = `scale(${currentScale})`;
            return;
        }
        lastTapTime = currentTime;

        if (e.changedTouches.length === 1 && currentScale === 1) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }
    });
}

function handleSwipe() {
    const threshold = 50;
    if (touchEndX < touchStartX - threshold) {
        navigateModal(1);
    }
    if (touchEndX > touchStartX + threshold) {
        navigateModal(-1);
    }
}

function openModal(imageIndex) {
    if (currentModalImages.length === 0) return;
    currentImageIndex = imageIndex;
    updateModalImage();
    document.getElementById('imageModal').style.display = "flex";
    document.body.style.overflow = "hidden";
}

function updateModalImage() {
    const modalImg = document.getElementById('modalImage');
    const counter = document.getElementById('modalCounter');
    
    modalImg.src = currentModalImages[currentImageIndex];
    currentScale = 1;
    modalImg.style.transform = "scale(1)";
    counter.innerText = `(${currentImageIndex + 1} / ${currentModalImages.length}) 指で拡大 / 左右スワイプで移動`;
    
    document.querySelector('.modal-prev').style.display = currentImageIndex > 0 ? "block" : "none";
    document.querySelector('.modal-next').style.display = currentImageIndex < currentModalImages.length - 1 ? "block" : "none";
}

function navigateModal(direction) {
    const newIndex = currentImageIndex + direction;
    if (newIndex >= 0 && newIndex < currentModalImages.length) {
        currentImageIndex = newIndex;
        updateModalImage();
    }
}

function closeModal() {
    document.getElementById('imageModal').style.display = "none";
    document.body.style.overflow = "auto";
}
</script>
