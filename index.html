\n \n \n \n \n \n \n \n \n \n \n表示された確認メッセージ画面で、OK ボタンをクリックします。 \n \n \n \n \n \n \n \n \n次ページに続きます \n \n2 \n4 \n5 \n6 \n7 \n8 \n9 \n初期値：ワイズマンシステム用フォルダ\\ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様\\取込 \n※ フォルダ指定は前回値保持されます。 \n3", "images": ["images/ワイズマン__p33.png"]}, {"id": "ワイズマン__page34", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 34, "text": "33 \n \n取込処理が完了すると、一覧に実行結果が表示されます。 \n※ \n取込が正常に完了したファイルは、バックアップ用フォルダに自動で移動されます。詳細は \n下記｢メモ｣を参照してください。 \n※ \n実行結果にエラー(×)や警告(!)が表示された場合は、エラー一覧ボタンをクリックして、 \nエラー内容を確認してください。 \n \n \n \n \n \n \n \n \n \n \n \n提供実績ファイル取込後は、[月間実績編集]画面で取り込まれた内容を確認してください。 \n※ \n詳細は次ページを参照してください。 \n \n \n本操作は以上です。 \n \n \n \n \n 取込に成功したファイルは、バックアップ用フォルダに移動されます。 \n \n \n \n取込に成功したファイルは、｢取込先｣に設定したフォルダから下記バックアップ用フォルダに自動\nで移動されます。 \n \n＜バックアップ用フォルダ＞ \n｢取込先｣に設定したフォルダの、ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様\\取込\\ｹｱﾌﾟﾗﾝ_自事業所の事業所番号_自\n事業所の事業所名(略称)\\ファイルを取り込んだ年月日・時刻 \n \n例｜・｢取込先｣に設定したフォルダ：C:\\ASPWise\\SP\\取込 \n・自事業所は西ワイズ居宅介護支援事業所(事業所番号:0300000007) \n・2025 年04 月07 日16 時にファイル取込 \n \nc:\\ (C ドライブ) \n∟\n ASPWise \n∟\n SP \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 取込 \n∟\nｹｱﾌﾟﾗﾝ_0300000007_西ワイズ居宅介護支援事業所 \n└\n2025 年04 月07 日16 時00 分00 秒 \n \n \n10", "images": ["images/ワイズマン__p34.png"]}, {"id": "ワイズマン__page35", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 35, "text": "34 \n \n [ケアマネジメント]－[ケアプラン]－[月間計画(月別)]／[月間計画(利用者別)]－\n[月間実績編集]画面 \n提供実績ファイルの取込後は、必ず[月間実績編集]画面で取り込まれた内容を確認し、 \n必要に応じて手動で訂正してください。 \n \n \n操作方法は従来と同様です。操作方法の詳細は、本機能のオンラインマニュアルを参照してください。 \n \n \n \n[月間実績編集]画面で訂正が必要な可能性がある主なケース \n \n \n計画通りに実施されたサービスでも、サービス提供事業所から送付された提供実績に不足が\nある場合は、実績日が空欄で取り込まれる／計画外のサービスとして別行で取り込まれる等\nの現象が発生します。下表を参照のうえ、必要に応じて訂正してください。 \n  \n訂正が必要なケース \n説明 \n全サービス共通 \nサービス提供事業所で使用している介護ソフトが、\n提供実績の出力に対応していないサービス \n実績を手入力してください。 \n計画に、サービス種類と事業所番号が \n同一の複数事業所が位置付けられている場合 \n(本体・サテライト双方を利用しているなど) \n提供実績ファイル内の｢サテライト枝番｣と、[関連機関マスター]の\n｢サテライト番号｣が一致する事業所に実績が取り込まれます。 \n本来と異なる事業所に実績が取り込まれた場合は、実績を手動で\n訂正してください。 \n11:訪問介護 \n身体9 生活3 のサービスが計画外の実績として\n取り込まれた場合 \n｢身体介護｣と｢生活援助｣の内訳が、｢身体介護｣は最長、｢生活\n援助｣は最短の実績として取り込まれます。 \n実績の内訳と異なる場合は、実績を手動で訂正してください。 \n17:福祉用具貸与、67:介護予防福祉用具貸与 \n計画に｢日額｣として位置づけられているサービス行 \n｢月額｣の計画外サービスとして別行で取り込まれます。 \n計画通りに実施されている場合は、｢日額｣の行に実績を手入力\nし、計画外の｢月額｣の行を行削除してください。 \nサービス提供事業所・サービス \nコード・単位数がすべて一致する品目 \n月間計画にサービスが追加された順に実績が割り当てられます。 \n本来と異なる品目に実績が割り当てられ、訂正が必要な場合は、\n実績を手動で訂正してください。 \n｢TAIS コード｣｢福祉用具届出コード｣が一致しな\nい場合 \n計画外サービスとして別行で取り込まれます。 \n計画通りに実施されている場合は、実績を手入力し、計画外として\n取り込まれたサービスは行削除してください。 \n \n※ ｢用具名称(機種名)｣が計画と異なっている場合は、｢TAIS コ\nード｣｢福祉用具届出コード｣が計画と一致していれば、計画\n通りの実績として1 行で取り込まれます(実績には計画と同じ\n用具名称(機種名)が表示されます。)", "images": ["images/ワイズマン__p35.png"]}, {"id": "ワイズマン__page36", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 36, "text": "35 \n \n訂正が必要なケース \n説明 \n22:短期入所療養介護、23:短期入所療養医療、2A:短期介護医療院 \n25:介護予防短期入所療養介護、26:介護予防短期入所療養医療、2B:介護予防短期介護医療院 \n日帰りショート、かつ提供実績ファイル内に提供時間\nの情報が存在しない場合 \n計画外サービスとして別行で取り込まれます。 \n計画通りに実施されている場合は、実績を手入力し、計画外として\n取り込まれたサービスは行削除してください。 \n30 日超過日 \n30 日超過日の情報は取り込まれません。 \n実績を手入力してください。 \n \n  \n \n \n エラーメッセージが表示された場合 \n \n \n \n \nメッセージの内容 \n説明 \n事業所表示ボタンクリックに表示されるエラーメッセージ \n対象データが存在しません。 \n｢取込先｣に指定したフォルダに、取込対象のファイルが投稿\nされていません。再度ファイルを投稿してください。 \n「事業所一覧」欄の｢エラー等の内容｣列に表示されるメッセージ \n関連機関が登録されていません。 \n事業所番号が一致する事業所が登録されていません。 \n[関連機関マスター]を確認してください。 \n○○年○○月時点で無効なサービス種類で\nす。体制情報を確認してください。 \n実績に位置付けられているサービス種類が[体制情報]に登\n録されていません。[体制情報]を確認してください。 \n「利用者一覧」欄の｢取込前チェック結果｣列に表示されるメッセージ \n月間計画が存在しません。 \n保険者番号・被保険者番号に該当する月間計画が存在\nしません。[月間計画編集]画面を確認してください。 \n \n \n \n ｢ケア種別｣の取り扱いについて \n \n \n \n｢ケアプランデータ連携標準仕様｣で作成された提供実績には、｢ケア種別｣の情報が含まれていませ\nん。そのため、提供実績ファイルを取り込むと、以下の通り設定されます。 \n \n76:訪問介護看護 \n・ いずれかのケア種別(介護／看護／介護・看護)を当てはめることで計画通りの実績として\n取込可能な場合 \n→ 計画と同じケア種別を自動設定して取り込みます。 \n・ 計画通りの実績として取り込みできない場合 \n→ 報酬体系｢一体型｣のサービスコード(定期巡回随時Ⅰ)にはケア種別｢介護・看護｣、 \n  報酬体系｢連携型｣のサービスコード(定期巡回随時Ⅱ)にはケア種別｢介護｣ \n  が設定されます。 \n \n73／75:(介護予防)小規模多機能型居宅介護、77:看護小規模多機能 \n基本サービスの実績はすべて｢契約期間｣として取り込みます。", "images": ["images/ワイズマン__p36.png"]}, {"id": "ワイズマン__page37", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 37, "text": "36 \n \n \n その他の注意・制限事項 \n \n \n \n同月に割引の有無が混在する場合や、割引が設定されている計画外の実績の場合、｢割引なし｣ \nとして取り込まれます。 \n訂正が必要な場合は、実績を手動で訂正してください。 \n \n｢保険者番号｣｢被保険者番号｣が同一の利用者が複数名いる場合、本来の利用者と異なる利用者に \n実績が取り込まれる場合があります。 \n｢保険者番号｣｢被保険者番号｣が同一の利用者が複数名いる場合、以下の順番で利用者を特定します。 \n① \n計画に位置付けられているサービスが、提供実績ファイルと一致する利用者 \n② \n①でも特定できない場合は、利用者コードが小さい利用者 \n \n本来と異なる利用者に取り込まれた場合は、各利用者の介護保険認定情報を確認したのち、 \n実績を手動で訂正してください。 \n \n提供実績削除情報(※)を取り込んだ場合の注意事項 ※ファイル名が｢DLTJSK…｣のファイル \n提供実績削除情報を取り込むと、[提供実績ファイル取込]で取込済みの対象の実績が削除されます。 \n※ [月間実績編集]画面や、[月間実績一括作成]画面で作成された実績は削除されません。", "images": ["images/ワイズマン__p37.png"]}, {"id": "ワイズマン__page38", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 38, "text": "37 \n \nSTEP8 \n居宅介護支援事業所／地域包括支援センターからのケアプランファイル\nを取り込む \n \n \n [ケアマネジメント]－[ケアプラン]－[ケアプランファイル取込] \n｢STEP5｣で地域包括支援センター／居宅介護支援事業所から受け取った提供実績ファイル\n以外のケアプランファイルを取り込み、内容を確認します。 \n \n \n操作方法は従来と同様です。操作方法の詳細は、本機能のオンラインマニュアルを参照してください。 \n \n \n \n操作 \nCSV ファイルを取り込み、確認する \n \n \n(1) [ケアプランファイル取込]でCSV ファイルを取り込む \n \n[ケアマネジメント]－[ケアプラン]－[ケアプランファイル取込]の順にクリックします。 \n \nフォルダ指定ボタンをクリックし、29 ページ｢STEP6｣⑤でCSV ファイルを投稿した\n｢取込｣フォルダを指定します。 \n \nファイル一覧表示ボタンをクリックします。 \n \n｢ファイル一覧｣欄で、CSV ファイルを取り込む事業所の｢選択｣列にチェックを付けます。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n        \n \n \n次ページに続きます  \n2 \n3 \n4 \n｢取込｣フォルダ(29 ページ参照)が初期表示されます。 \n※ フォルダ指定は前回値保持されます。 \n事業所番号～ファイル種類 \nCSV ファイルのファイル名を参照して表示されます。 \n※ファイル種類「削除情報」には、取り消された利用者\nの情報が含まれています。削除する際に単独で取り\n込んでください(印刷できないファイルです)。", "images": ["images/ワイズマン__p38.png"]}, {"id": "ワイズマン__page39", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 39, "text": "38 \n \n利用者表示ボタンをクリックします。 \n \n｢利用者一覧｣欄に表示された利用者について、｢実行前チェック結果｣｢利用者一覧表示\n結果・エラー等の内容｣列を確認します。 \n※ 「実行前チェック結果」列にエラー(×)や警告(!)が表示された場合は、｢利用者一覧表示結\n果・エラー等の内容｣列、エラー一覧ボタンから開くエラー内容を確認してください(41 ペ\nージ参照)。 \n \nCSV ファイルを取り込む利用者の「選択」列にチェックを付けます。 \n \n実行ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n取込処理が完了すると、｢利用者一覧｣欄に実行結果が表示されます。 \n｢実行結果｣｢利用者表示結果・エラー等の内容｣列で、出力結果を確認します。 \n※ \n取込が正常に完了したファイルは、バックアップ用フォルダに自動で移動されます。詳細は \n次ページ｢メモ｣を参照してください。 \n \n \n \n \n \n \n \n \n次ページに続きます  \n \n6 \n5 \n7 \n8", "images": ["images/ワイズマン__p39.png"]}, {"id": "ワイズマン__page40", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 40, "text": "39 \n \n取り込まれたデータの内容を確認します。 \n※ \n確認方法は下記の2 通りあります。 \n確認方法 \n説明 \n参照ページ \n[ケアプランファイル印刷]で \n確認する \n本機能の[ケアプランファイル印刷]画面で、プレビュー表示\n／帳票印刷で確認します。 \n本ページ(2) \n各機能で確認する \n各機能の画面表示、またはプレビュー表示／帳票印刷で\n確認します。 \n42 ページ \n \n (2) [ケアプランファイル印刷]でプレビュー／印刷して確認する \n \n[ケアマネジメント]－[ケアプラン]－[ケアプランファイル取込]の画面上部で、 \nケアプランファイル印刷ボタンをクリックします。 \n \n｢対象期間｣｢対象帳票｣を設定します。 \n※ \n｢対象期間｣には、取り込んだデータが作成／修正された日時を含めて2 ヶ月以内の期間を \n設定してください。 \n \n必要に応じて｢利用者｣を選択します。 \n \n利用者表示ボタンをクリックします。 \n \n｢利用者一覧｣欄で、取り込んだデータを印刷／プレビューする利用者を選択します。 \n※ \n複数名を同時に選択してプレビュー／印刷することはできません。 \n \n印刷ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n表示された印刷指示画面で、プレビュー／印刷ボタンをクリックします。 \n各機能からプレビュー／印刷した場合と同様の帳票レイアウトでプレビュー／印刷されます。 \n \n \n \n \n \n本操作は以上です。 \n1 \n2 \n3 \n4 \n6 \n7 \n5", "images": ["images/ワイズマン__p40.png"]}, {"id": "ワイズマン__page41", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 41, "text": "40 \n \n \n 取込に成功したファイルは、バックアップ用フォルダに移動されます。 \n \n \n \n取込に成功したファイルは、｢取込先｣に設定したフォルダから下記バックアップ用フォルダに自動\nで移動されます。 \n \n＜バックアップ用フォルダ＞ \n｢取込先｣に設定したフォルダの、ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様\\取込\\ｹｱﾌﾟﾗﾝ_自事業所の事業所番号_自\n事業所の事業所名(略称)\\ファイルを取り込んだ年月日・時刻 \n \n例｜・｢取込先｣に設定したフォルダ：C:\\ASPWise\\SP\\取込 \n・自事業所は西ワイズ居宅介護支援事業所(事業所番号:0300000007) \n・2025 年04 月07 日16 時にファイル取込 \n \nc:\\ (C ドライブ) \n∟\n ASPWise \n∟\n SP \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 取込 \n∟\nｹｱﾌﾟﾗﾝ_0300000007_西ワイズ居宅介護支援事業所 \n└\n2025 年04 月07 日16 時00 分00 秒 \n \n \n \n \n補足1 ｜[ケアプランファイル取込]画面で表示されるエラーメッセージ \n \n \n[ケアプランファイル取込]画面で表示される、おもなエラーメッセージの対処方法は下表の\nとおりです。 \n \n区分 \nメッセージ内容 \n対処方法 \nファイル表示ボタンクリック後に画面表示されるメッセージ \nエラー \n対象となるファイルが存在しません。 \n｢取込先｣に指定したフォルダ直下に、取込対象のファイル\nが投稿されていません。 \nファイルが投稿されているか確認してください。 \n実行ボタンクリック後に画面表示されるメッセージ * \nエラー \n取込処理の結果、エラー・警告が発生しています。 \n実行結果を確認してください。 \nエラー一覧ボタンをクリックし、表示された[エラー一覧]画\n面でエラー内容を確認してください。 \n \n* 本エラーの表示有無に関わらず、取込を実行したファイルは、｢取込先｣に設定したフォルダからバック \nアップ用フォルダに自動で移動されます。 \n一度取込を実行したCSV ファイルを再度取り込みたい場合は、手動でバックアップフォルダから取込フ\nォルダへ移動してください。", "images": ["images/ワイズマン__p41.png"]}, {"id": "ワイズマン__page42", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 42, "text": "41 \n \n補足2 ｜[ケアプランファイル取込] 一覧に表示されるおもなメッセージ \n \n \n[ケアプランファイル取込]画面の一覧に｢エラー｣が表示されたデータは、取込実行時にエラ\nーとなり取り込めません。取り込む場合は、一覧に表示されているメッセージと下表を参照\nして必要な対処を行ってから取り込んでください。 \n \n区分 \n「一覧表示結果・エラー等の内容」\nに表示されるメッセージ \n対処方法 \nファイル一覧表示ボタンクリック後に、「ファイル一覧表示」欄に表示されるメッセージ \nエラー \n事業所が特定できません。 \nCSV ファイルの事業所番号から送信元事業所を特定できませんでした。 \n事業所特定ボタンをクリックして、事業所を特定してください。 \n利用者表示ボタンクリック後に、「利用者一覧表示」欄に表示されるメッセージ \nエラー \n利用者が特定できません。 \nCSV ファイルの利用者情報から利用者を特定できませんでした。 \n利用者特定ボタンをクリックして、利用者を特定してください。 \nエラー \n有効な認定情報が存在しません。 \n[利用者台帳(介護保険)]画面に認定情報が正しく登録されているか\n確認してください。 \nエラー \n有効な委託受託情報が存在しま\nせん。 \n[受託情報]／[委託情報]に、開始・終了期間、委託元地域包括支\n援センター／委託先居宅介護支援事業所の情報が正しく登録されて\nいるか確認してください。 \nエラー \nサービス提供事業所が特定できま\nせん。 \nCSV ファイルの事業所番号からサービス提供事業所を特定できません\nでした。 \n事業所特定ボタンをクリックして、事業所を特定してください。 \nエラー \n無効なサービス種類です。体制情\n報を確認してください。 \n[体制情報]画面に、対象年月時点で有効な体制情報が登録されて\nいるか確認してください。 \n警告 \n担当者を設定しませんでした。 \nCSV ファイルの担当者名称に紐づく職員が存在しないため、「作成担当\n者」「計画作成者」を空欄で取り込みました。 \n実行ボタンクリック後に、「利用者一覧表示」欄に表示されるメッセージ * \nエラー \n削除対象のデータが存在しません。 \n「削除情報ファイル」(ファイル名が「DLT」から始まるCSV ファイル)を取り\n込んだ際に、削除対象のデータが存在しません。 \n必要に応じて、削除対象のデータがシステムに取り込み済かご確認くださ\nい。 \nエラー \nデータがすでに登録されています。 \n同じデータが既に登録されています。 \n取込が必要な場合は、「取込データの上書き：上書きする」に設定して\n再度取り込んでください。 \n* 本エラーの表示有無に関わらず、取込を実行したファイルは、｢取込先｣に設定したフォルダからバックア\nップ用フォルダに自動で移動されます。 \n一度取込を実行したCSV ファイルを再度取り込みたい場合は、手動でバックアップフォルダから取込フ\nォルダへ移動してください。", "images": ["images/ワイズマン__p42.png"]}, {"id": "ワイズマン__page43", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 43, "text": "42 \n \n [介護予防事業]－[スクリーニング]－[利用者基本情報] \n[ケアプランファイル取込]で取り込んだデータを確認する場合は、履歴ボタンから画面 \n表示・帳票出力して確認してください。 \n \n \n以下の項目は、一律で空欄で取り込まれます。 \n・弊社独自の項目など「ケアプランデータ連携標準仕様｣のファイルレイアウトに存在しない項目 \n・｢同意日｣｢同意者氏名｣ \n \n取り込んだデータは、必要に応じて編集・削除ができます。 \n誤送信された等の理由でデータが必要な場合は、削除ボタンから削除するか、連携先事業所に削除ファ \nイルの出力・送信を依頼し、[ケアプランファイル取込]で削除ファイルを取り込んで削除してください。 \n \n操作方法は従来と同様です。操作方法の詳細は、本機能のオンラインマニュアルを参照してください。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n[基本情報(2)]タブ｜｢家族構成｣欄の家系図は、[ケアプランファイル印刷]画面で \nプレビュー／印刷して確認してください。 \n \n \n \n[ケアプランファイル取込]で取り込んだ家系図の画像ファイルは、本機能では画面表示／帳票出力\nに対応していません(｢家族構成｣欄は空欄で表示されます)。 \n \n取り込まれた家系図のデータを確認する場合は、[ケアマネジメント]－[ケアプラン]－[ケアプラン\nファイル取込]－[ケアプランファイル印刷]でプレビュー／印刷して確認してください。 \n[ケアプランファイル取込]で取り \n込んだデータを確認する場合 \nは、履歴ボタンから画面表示 \nしてください。 \n[ケアプランファイル取込]で取り込んだデータは、\n以下の通り表示されます。 \n■取込後 \n・ 他事業所で登録されたデータとして「参照」\nモードで表示されます。 \n・ [履歴]画面では「作成担当者」｢作成事業 \n所」が空欄表示されます。 \n■自事業所で登録した後 \n・ 「編集」モードで表示されます。 \n・ [履歴]画面では「作成事業所」に自事業所\nが表示されます。 \n[ケアプランファイル取込]で取り込んだデータを登録・削除 \nしようとすると確認メッセージが表示されます。登録・削除 \nする場合はOK ボタンをクリックしてください。 \n■登録時に表示されるメッセージ \n \n \n \n \n \n■削除時に表示されるメッセージ", "images": ["images/ワイズマン__p43.png"]}, {"id": "ワイズマン__page44", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 44, "text": "43 \n \n [ケアプラン]－[ケアマネジメント]－[予防サービス計画] \n[ケアプランファイル取込]で取り込んだデータを確認する場合は、履歴ボタンから画面 \n表示・帳票出力して確認してください。 \n \n \n弊社独自の項目など「ケアプランデータ連携標準仕様｣のファイルレイアウトに存在しない項目は、一律\nで空欄で取り込まれます。 \n \n項目｢同意者氏名｣は本システムに入力欄がないため取り込まれません。 \n \n取り込んだデータは、必要に応じて編集・削除ができます。 \n誤送信された等の理由でデータが必要な場合は、削除ボタンから削除するか、連携先事業所に削除ファ \nイルの出力・送信を依頼し、[ケアプランファイル取込]で削除ファイルを取り込んで削除してください。 \n \n操作方法は従来と同様です。操作方法の詳細は、本機能のオンラインマニュアルを参照してください。 \n \n■ [基本(1)]画面 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n[ケアプランファイル取込]で取り込んだデータは、\n以下の通り表示されます。 \n■取込後 \n・ 他事業所で登録されたデータとして「参照」 \nモードで表示されます。 \n・ [履歴]画面には、「作成担当者」｢作成事 \n業所」が空欄表示されます。 \n・ [最終更新情報]画面には、「更新事業所： \n未設定、更新者：ケアプランファイル取込 \nデータ」と表示されます。 \n■自事業所で登録した後 \n・ 「編集」モードで表示されます。 \n・ [履歴]画面には、「作成担当者」「作成事\n業所」が登録内容に基づき表示されます。 \n・ [最終更新情報]画面には、実際の更新 \n事業所・職員の情報が表示されます。 \n[ケアプランファイル取込]で取り \n込んだデータを確認する場合 \nは、履歴ボタンから画面表示 \nしてください。 \n[ケアプランファイル取込]で取り込んだデータを登録・削除 \nしようとすると確認メッセージが表示されます。登録・削除 \nする場合はOK ボタンをクリックしてください。 \n例｜基本(1)画面の場合 \n■登録時に表示されるメッセージ \n \n \n \n \n \n※ 「計画作成者」が未設定(空欄)の場合は、▼ボタンか\nら設定してから登録してください。 \n \n■削除時に表示されるメッセージ", "images": ["images/ワイズマン__p44.png"]}, {"id": "ワイズマン__page45", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 45, "text": "44 \n■ [支援計画(4)]画面 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nサービス種別～期間 \nテキスト入力のデータとして取り込まれます。", "images": ["images/ワイズマン__p45.png"]}, {"id": "ワイズマン__page46", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 46, "text": "45 \n \n [ケアマネジメント]－[ケアプラン]－[月間計画(月別)]／[月間計画(利用者別)] \n【地域包括SP のみ】 \n[ケアプランファイル取込]で取り込んだデータを確認する場合は、[月間計画編集]／[月間実\n績編集]画面で表示・帳票出力して確認してください。  \n \n \n取り込んだデータは、必要に応じて編集・削除ができます。 \n誤送信された等の理由でデータが必要な場合は、削除ボタンから削除するか、連携先事業所に削除ファ \nイルの出力・送信を依頼し、[ケアプランファイル取込]で削除ファイルを取り込んで削除してください。 \n \n操作方法は従来と同様です。操作方法の詳細は、本機能のオンラインマニュアルを参照してください。 \n \n■ [月間計画管理(月別)]画面 \n \n \n \n \n \n \n \n \n \n \n \n \n \n■ [月間計画編集]画面 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n  \n \n[月間計画(月別)]画面で、[ケアプランファイル取\n込]で取り込んだデータを確認する場合は、「ケア \nプランデータ連携の取込データも表示」にチェックを\n付けてから一覧表示してください。 \n※ チェック無の場合、取り込んだデータは一覧\nに表示されません。 \n※ [月間計画管理(利用者別)]画面は、取り\n込んだデータも一律で表示されるため、本チ\nェックボックスはありません。 \n[ケアプランファイル取込]で取り込んだデータは、\n以下の通り表示されます。 \n■取込後 \n・ 他事業所で登録されたデータと同様に「訂正」 \nモードで表示されます。 \n・ [最終更新情報]画面には、「更新事業所：  \n未設定、更新者：ケアプランファイル取込 \nデータ」と表示されます。 \n■自事業所で登録した後 \n・ 「編集」モードで表示されます。 \n・ [最終更新情報]画面には、実際の更新 \n事業所・職員の情報が表示されます。 \n[ケアプランファイル取込]で取り込んだデータを登録・削除 \nしようとすると確認メッセージが表示されます。登録・削除 \nする場合はOK ボタンをクリックしてください。 \n■登録時に表示されるメッセージ \n \n \n \n※\n月間計画を編集する場合は、上記メッセージで\nOK ボタンをクリックした後、作成担当者ボタンを\nクリックして「計画作成者」を自事業所の職員に\n変更し、登録してください。 \n \n■削除時に表示されるメッセージ \n＜月間実績未登録の場合＞ \n \n \n   \n＜月間実績登録済みの場合＞", "images": ["images/ワイズマン__p46.png"]}, {"id": "ワイズマン__page47", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 47, "text": "46 \n3 サービス提供事業所向けシステム \n \n本章では、弊社のサービス提供事業所向けシステムの操作をご説明します。 \n \n運用イメージと操作の流れ \n \n \n \n｢ケアプランデータ連携標準仕様｣によるデータ連携の運用イメージ \n \n \n｢ケアプランデータ連携標準仕様｣で作成されたケアプランデータを連携する場合の運用イメ\nージは下図の通りです。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n取\n込 \n出\n力 \n提供実績 \n \n \ncsv \nサービス提供事業所｜ワイズマン サービス提供事業所向けシステム \n \nサービス提供票、居宅サービス計画書等の取り込みと、提供実績の出力を行います。 \n提供票取込 \n提供票・別表       ｜[予定・実績]－[提供票]－[提供票取込] \n居宅サービス計画書等｜[予定・実績]－[提供票]－[ケアプランファイル取込] \n提供実績出力 \n[予定・実績]－[提供実績]－[提供票実績 確定]／[提供実績ファイル出力]など \n \n居宅サービス計画書／サービス提供票の出力と、提供実績の取込を行います。 \nケアプラン作成事業所 \n国保中央会｢ケアプランデータ連携システム｣等を介して、ケアプランデータ送受信 \n出\n力 \n取\n込 \n提供票・別表 \n提供票(利用票)、別表、 \n利用者補足情報 \n \n居宅サービス計画書 \n第1 表、第2 表、第3 表 \n利用者補足情報 \n \n介護予防サービス・支援計画書 \n介護予防サービス・支援計画書、別表 \n  \n利用者基本情報 \n利用者基本情報、別表1、別表2、 \n家族構成画像 \n  \n削除情報(必要時のみ) \ncsv \ncsv \ncsv \ncsv \ncsv \njpg", "images": ["images/ワイズマン__p47.png"]}, {"id": "ワイズマン__page48", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 48, "text": "47 \n \n \n操作の流れ \n \n \n \n \n毎月の操作 \n \n \n提供票ファイルを取り込む \nケアプラン作成事業所からファイルを受け取ったら、｢居宅サービス計画の確認｣、と｢提供\n票ファイルの取込｣を行います。 \n※ \n提供票取込以降のシステム操作は従来と同様です。 \n \n \nSTEP1 \nケアプラン作成事業所からファイルを受け取る ···································· 48 ページ \n \n \n \n \n \n \nSTEP２ 居宅サービス計画等を表示・確認する ················································ 51 ページ \n \n \n \nサービス提供事業所向け各システム｜[予定・実績]－[提供票]－[ケアプランファイル取込] \n \n \nSTEP3 \n提供票ファイルを取り込む ······························································ 59 ページ \n \n \n \nサービス提供事業所向け各システム｜[予定・実績]－[提供票]－[提供票取込] \n \n提供実績ファイルを出力する \n当月の実績が確定したら、従来通りの手順で提供実績ファイルの出力を行います。 \n変換した提供実績ファイルは、ケアプラン作成事業所に送付します。 \nなお、STEP4 以降の操作は、STEP3 の完了後に実施してください。 \n \n \nSTEP4 \n提供実績を確定する ······································································· 68 ページ \n \n \n \nサービス提供事業所向け各システム｜[予定・実績]－[提供実績]－[提供票実績 確定] \n \n \nSTEP5 \n提供実績をファイル出力する ··························································· 70 ページ \n \n \n \nサービス提供事業所向け各システム｜[予定・実績]－[提供実績]－[提供実績ファイル出力] \n \n \nSTEP6 \nケアプラン作成事業所にファイルを送付する ······································· 73 ページ \n \n \n \n \n \n取り込んだファイルを活用する \nSTEP2 によりワイズマンシステムSP に取り込んだファイルは、[サマリー]や[個別援助計画\n書]/[リハビリ実施計画書]の作成時にも参照できます。 \n \n \n 活用 \nそのほかの機能で居宅サービス計画等を参照する ·································· 75 ページ", "images": ["images/ワイズマン__p48.png"]}, {"id": "ワイズマン__page49", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 49, "text": "48 \n毎月の操作 \n \n・ ケアプラン作成事業所からファイルを受け取ったら、｢居宅サービス計画の確認｣と｢提供票ファイルの\n取込｣を行います。 \n・ 当月の実績が確定したら、従来通りの手順で提供実績ファイルの出力を行います。変換した提供実績\nファイルは、ケアプラン作成事業所に送付します。 \n \n \nSTEP1 ケアプラン作成事業所から提供票ファイルを受け取る \n \n国保中央会｢ケアプランデータ連携システム｣等を介して、ケアプラン作成事業所から送信\nされた居宅サービス計画・提供票ファイルを受け取ります。 \n受け取ったファイルは、｢ケアプランデータ連携標準仕様｣によるデータ連携を行うコンピ\nュータの｢ケアプランデータ連携標準仕様｣フォルダ内、｢取込｣フォルダに投稿します。 \n \n \n｢ケアプランデータ連携システム｣を介してデータ受信する場合は、ケアプラン作成事業所から送信 \nされた提供実績ファイルを、｢ケアプランデータ連携クライアント｣でダウンロードしてください。 \n \n｢ケアプランデータ連携クライアント｣の操作方法は、国保中央会提供の操作マニュアル等を参照して\nください。ご不明点は、国保中央会にお問い合わせください。 \n \n \n \n ｢取込｣フォルダについて \n \n \n \nシステム起動後、事業所選択時に[ケアプランデータ連携標準仕様]の取込用フォルダが自\n動で作成されます。 \n \n■各作業フォルダの役割 \n \n \nフォルダ \n格納されるファイル \n説明 \n1 取込用フォルダ \n｢ケアプランデータ連携標準 \n仕様｣の提供票ファイル \n・ケアプラン作成事業所から提供票ファイルを受け取っ\nたら、本フォルダに投稿してください。 \n・弊社サービス提供事業所向けシステムで提供票ファ\nイルを取り込む際は、本フォルダを指定してください。 \n2 出力用フォルダ \n｢ケアプランデータ連携標準 \n仕様｣の提供実績ファイル \n・弊社サービス提供事業所向けシステムで提供実績\nファイルを出力する際は、本フォルダを指定してくださ\nい。 \n・ケアプラン作成事業所へ提供実績ファイルを送付す\nる際は、本フォルダ内のファイルを使用してください。", "images": ["images/ワイズマン__p49.png"]}, {"id": "ワイズマン__page50", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 50, "text": "49 \n例 \n作業フォルダ 構成イメージ \n例｜ \nC:\\ (C ドライブ)  \n└  ASPWise \n└  SP \n└  ケアプランデータ連携標準仕様 \n└  取込 \n└  出力 \n \n \n \n \n \n \n \n操作 \n取込用フォルダに投稿する \n \n \n \n \n国保中央会｢ケアプランデータ連携システム｣を介して、データ送受信する場合 \n \n \n \n国保中央会｢ケアプランデータ連携クライアント｣で、CSV ファイルをダウンロードします。 \n※ \nケアプラン作成事業所から送付されるCSV ファイルは最大15 種類です。 \nファイル名 \nファイルの内容 \n備考 \nUPHOSOKU… \n利用者補足情報 \n取込時 必須 \nUPPLAN… \n第6 表情報 \n提供票取込時 \n必須 \nUPSIKYU… \n第7 表情報 \nDLTPLAN… \n第6 表情報_削除 \n任意(削除時に必要) \nUP1KYO… \n居宅サービス第1 表 \nケアプランファイル \n取込時 必須 \nDLT1KYO… \n居宅サービス第1 表_削除 \n任意(削除時に必要) \nUP2KYO… \n居宅サービス第2 表 \n任意 \n第1 表と併せて取込 \nUP3KYO… \n居宅サービス第3 表 \nUPKIHON… \n利用者基本情報 \n \n単独取込可 \n \nUPKIHON_SUB1… \n利用者基本情報(別表1) \nUPKIHON_SUB2… \n利用者基本情報(別表2) \nDLTKIHON… \n利用者基本情報_削除 \n任意(削除時に必要) \nUPYOBO… \n介護予防サービス・支援計画書 \n \n単独取込可 \nUPYOBO_SUB… \n介護予防サービス・支援計画書(別表)支\n援計画 \nDLTYOBO… \n介護予防サービス・支援計画書_削除 \n任意(削除時に必要) \n \n \n \n次ページに続きます \n \n 1  \n 2", "images": ["images/ワイズマン__p50.png"]}, {"id": "ワイズマン__page51", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 51, "text": "50 \nC:\\ (C ドライブ)  \n└  ASPWise \n└  SP \n└  ケアプランデータ連携標準仕様 \n└  取込 \nUPKIHON_0300000121_43_0000000149_15_20250401123456.CSV \nUP1KYO_0300000121_43_0000000149_15_20250401123456.CSV \nUPHOSOKU_202504_0300000121_43_0000000149_15_20250401123456.CSV 等。 \n \n \n例｜サービス提供年月｢2025 年04 月｣分のファイルが居宅介護支援事業所(事業所番号:0300000121)\nから自事業所(事業所番号:0000000149)に送付された場合 \n※｢43：居宅介護支援｣から、｢15：通所介護｣の事業所に送付された場合 \n■利用者補足情報ファイル \nUPHOSOKU_202504_0300000121_43_0000000149_15_20250420165913.CSV \n└提供年月   └居宅介護支援事業所の  └自事業所の   └出力日時 \n事業所番号           事業所番号 \n■サービス利用票(実績情報)ファイル \nUPPLAN_202504_0300000121_43_0000000149_15_20250420165913.CSV \n└提供年月   └居宅介護支援事業所の  └自事業所の   └出力日時 \n事業所番号           事業所番号 \n■居宅サービス計画書用ファイル \nUP1KYO_0300000121_43_0000000149_15_20250420165913.CSV \n└居宅介護支援事業所の  └自事業所の   └出力日時 \n事業所番号           事業所番号 \n \n受け取ったCSV ファイルをすべて、｢ケアプランデータ連携標準仕様｣によるデータ連携\nを行うコンピュータの｢ケアプランデータ連携標準仕様連携｣フォルダ内、｢取込｣フォルダ\n(49 ページ参照)に投稿します。 \n※ \n連携先ケアプラン作成事業所が複数ある場合 \n→ケアプラン作成事業所ごとにフォルダを分けて投稿する必要はありません。 \n \n■｢取込フォルダ｣への投稿イメージ \n例｜他法人の居宅介護支援事業所(事業所番号:0300000121)から受信したファイルを、 \n自法人のサービス提供事業所(事業所番号:0000000149)｣のフォルダに投稿する場合 \n  ※受信日時：2025 年4 月1 日12 時34 分56 秒 \n \n \n \n \n \n  \n \n \n \n \n \n \n \n \n   \n \n \n本操作は以上です。 \n \n \n■国保中央会｢ケアプランデータ連携システム｣を介して、居宅介護支援事業所から受信したデータ \n20250401123456_0300000121 \nUPKIHON_0300000121_43_0000000149_15_20250401123456.CSV \nUP1KYO_0300000121_43_0000000149_15_20250401123456.CSV \nUPHOSOKU_202504_0300000121_43_0000000149_15_20250401123456.CSV  等。 \nフォルダ内に格納されている｢CSV ファイル｣をすべて投稿します。", "images": ["images/ワイズマン__p51.png"]}, {"id": "ワイズマン__page52", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 52, "text": "51 \n \nSTEP2 居宅サービス計画を表示・印刷する \n \n \n [予定・実績/実績]－[提供票]－[ケアプランファイル取込] \n[記録管理]－[個別援助計画/機能訓練計画]－[ケアプランファイル取込] \n厚生労働省提示の｢ケアプランデータ連携標準仕様｣に準拠したケアプラン関連のCSV ファ\nイルの取り込み、表示・印刷をします。 \n \n \nケアプランデータ連携標準仕様の旧バーションのファイル取込は本機能ではできません。 \n \n[サマリー]／[個別援助計画]／[機能訓練計画]機能で[ケアプランファイル取込]で取り込んだ情報を\n参照しながら入力できます(詳細は75 ページ参照)。 \n \n \n操作 \n｢ケアプランファイル取込｣で各CSV ファイルを取り込む \n \n \n \n[予定・実績/実績]－[提供票]－[ケアプランファイル取込] の順にクリックします。 \n \nフォルダ指定ボタンをクリックし、49 ページ｢STEP1｣でCSV ファイルを投稿した｢取込｣フ\nォルダを指定します。 \n \nファイル一覧表示ボタンをクリックします。 \n※ \n｢ファイル一覧｣欄に、｢取込｣フォルダ(49 ページ参照)内の居宅サービス第1 表のファイル名\nが表示されます。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n次ページに続きます  \n \n \n2 \n3 \n｢取込｣フォルダ(49 ページ参照)が初期表示されます。 \n※ フォルダ指定は前回値保持されます。", "images": ["images/ワイズマン__p52.png"]}, {"id": "ワイズマン__page53", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 53, "text": "52 \n \n｢ファイル一覧｣欄で、CSV ファイルを取り込む事業所の｢選択｣列にチェックを付けま\nす。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n利用者表示ボタンをクリックします。 \n※ \n｢利用者一覧｣欄に表示されている利用者全員が取込の対象となります。 \n \n実行ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n取込処理が完了すると、｢利用者一覧｣欄に実行結果が表示されます。 \n｢実行結果｣｢利用者表示結果・エラー等の内容｣列で、出力結果を確認します。 \n※ \n実行結果にエラー(×)や警告(!)が表示された場合は、エラー一覧ボタンをクリックして、 \nエラー内容を確認してください(55 ページ参照)。 \n \n \n本操作は以上です。 \n6 \n居宅介護支援事業所の判別方法 \nファイル名の事業所番号で判別してください。 \n例｜UP1KYO _ 0300000121 _ 43 _ 0000000149 _ 15 _ 20250620165913.CSV \n└居宅の        └居宅側の └自事業所の └自事業所の  └出力日時 \n事業所番号      サービス種類 事業所番号  サービス種類 \n削除情報ファイル \nファイル名が｢DLT｣から始\nまるcsv ファイルです。 \n※居宅サービス計画書が\n取り消された利用者の\n情報が含まれています。 \n※印刷できないファイルです。 \n※削除する際に単独で取\nり込んでください。 \n4 \n5", "images": ["images/ワイズマン__p53.png"]}, {"id": "ワイズマン__page54", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 54, "text": "53 \n \n \n 取込を実行したファイルは、バックアップ用フォルダに移動されます。 \n \n \n \nエラーの有無に関わらず、取込を実行したファイルは、｢取込先｣に設定したフォルダから下記\nバックアップ用フォルダに自動で移動されます。 \n \n＜バックアップ用フォルダ＞ \n｢取込先｣に設定したフォルダの、ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様\\取込\\ｹｱﾌﾟﾗﾝ_自事業所の事業所番号\n_自事業所の事業所名(略称)\\ファイルを取り込んだ年月日・時刻 \n \n例｜・｢取込先｣に設定したフォルダ：C:\\ASPWise\\SP\\ケアプランデータ連携標準仕様\\取込 \n・自事業所：ワイズデイサービス(事業所番号: 0000000149) \n・2025 年04 月07 日16 時にファイル取込 \n \nc:\\ (C ドライブ) \n∟\n ASPWise \n∟\n SP \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 取込 \n∟\nｹｱﾌﾟﾗﾝ_0000000149_ワイズデイサービス \n└\n2025 年04 月07 日16 時00 分00 秒", "images": ["images/ワイズマン__p54.png"]}, {"id": "ワイズマン__page55", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 55, "text": "54 \n \n \n \n エラー｢特定されない利用者が含まれています｣が表示された場合 \n \n \n \n上記のエラーが表示された場合、以下の手順で利用者を特定します。 \n \n操作 \n利用者を特定する \n① \n[ケアプランファイル取込]画面から利用者特定ボタンをクリックします。 \n② \n特定する利用者の｢選択｣列にチェックを付けます。 \n③ \n登録をクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n本操作は以上です。 \nメッセージの内容 \n説明 \nエラー｢特定されない利用者が含まれています。\n利用者特定機能により、利用者特定を行ってく\nださい｣ \n \n \n｢被保険者番号｣が同一の利用者が複数名いる場合に表\n示されます。利用者特定ボタンから利用者を選択してくださ\nい。 \n \n \n \n3 \n2", "images": ["images/ワイズマン__p55.png"]}, {"id": "ワイズマン__page56", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 56, "text": "55 \n \n \n エラーメッセージが表示された場合 \n \n \n \nエラー一覧ボタンから確認できるエラー \nメッセージの内容 \n説明 \n【エラー】｢利用者補足情報(UPHOSOKU)｣の\nファイルが存在しないため、内容を表示できませ\nん。 \n計画書の表示に必要な利用者補足情報のファイルが、取\n込フォルダに存在しません。 当該フォルダにファイル名が\n｢UPHOSOKU｣から始まる CSV ファイルを保存して再実\n行してください。 \n選択中のCSV ファイルよりも、新しいCSV ファイ\nルが取込済みのため、取込を実行できません。 \n出力日時が取込済みのファイルよりも古い場合に表示され\nます。 \n各CSV ファイルの末尾14 桁をご確認ください。 \n14 桁の数字は左から年月日時秒の形式になっており、 \nケアプラン作成事業所がCSV ファイルの出力を行った際の\n日時情報が設定されています。 \n実行処理完了後に表示されるエラー \nメッセージの内容 \n説明 \n実行処理の結果、エラーが発生しています。 \nエラー一覧画面を確認してください。 \nエラー一覧ボタンからエラーを確認してください。 \nエラーの有無に関わらず、一度、実行対象としたCSV ファイ\nルは、一律、取込フォルダ内のバックアップフォルダへ移動しま\nす。 \n一度取込を実行したCSV ファイルを対象に、再度取込を\n実行したい場合は、手動で取込フォルダへ移動してください。 \nファイル一覧表示ボタンクリックに表示されるエラーメッセージ画面 \nメッセージの内容 \n説明 \n対象となるファイルが存在しません。 \n｢取込先｣に指定したフォルダに、取込対象のファイルが投稿\nされていません。 \n再度ファイルを投稿してください。", "images": ["images/ワイズマン__p56.png"]}, {"id": "ワイズマン__page57", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 57, "text": "56 \n \n操作 \n｢ケアプランファイル取込｣で各帳票を印刷する。 \n \n \n \n[予定・実績/実績]－[提供票]－[ケアプランファイル取込] の順にクリックします。 \n \nケアプラン印刷ボタンをクリックします。 \n \n｢対象期間｣を設定します。 \n※ \n対象期間はケアプラン作成事業所が計画を作成または修正した日時を含めた2 ヶ月以内の期間を設定し\nてください。 \n \n｢対象帳票｣を設定します。 \n※ \n印刷可能な帳票は5 種類です。 \n対象帳票 \n帳票名 \n利用者基本情報 \n利用者基本情報 \n居宅サービス計画書 \n居宅サービス計画書(1) \n居宅サービス計画書(2) \n週間サービス計画表 \n介護予防サービス計画書 \n介護予防サービス・支援計画書 \n \n「計画作成事業者」を選択します。 \n※ 計画作成事業者欄には居宅介護支援事業所番号を入力してください。 \n \n必要に応じて｢利用者｣を選択します。 \n \n利用者表示ボタンをクリックします。 \n \n帳票を印刷する利用者を選択します。 \n \n印刷ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n次ページに続きます \n \n2 \n3 \n4 \n7 \n9 \n5 \n8", "images": ["images/ワイズマン__p57.png"]}, {"id": "ワイズマン__page58", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 58, "text": "57 \n \n表示された印刷指示画面で、プレビュー／印刷ボタンをクリックします。 \n※ \n一部の項目は、厚生労働省から提示されている様式とは名称等が異なります。 \n \n \n \n \n \n \n \n \n本操作は以上です。 \n■帳票｢利用者基本情報｣ \n \n \n \n \n \n \n \n \n \n \n \n \n \n■帳票｢居宅サービス計画書｣第１表・第２表  \n  \n \n \n \n \n \n \n \n \n \n10", "images": ["images/ワイズマン__p58.png"]}, {"id": "ワイズマン__page59", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 59, "text": "58 \n \n■帳票｢介護予防サービス・支援計画書｣ \n \n \n \n \n \n \n \n \n \n \n■帳票｢週間サービス計画表｣", "images": ["images/ワイズマン__p59.png"]}, {"id": "ワイズマン__page60", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 60, "text": "59 \n \nSTEP3 提供票ファイルを取り込む \n \n \n [予定・実績]－[提供票]－[提供票 取込] \nケアプランデータ連携標準仕様ファイルを、[提供票取込]機能で取り込みます。 \n \n \n \n操作 \n提供票を取り込む \n \n \n \n[予定・実績]－[提供票]－[提供票 取込]の順にクリックし、［提供票取込］画面を開きます。 \n \n｢対象年月｣を設定します。 \n \n｢取込先｣で｢ケアプランデータ連携｣を選択します。 \nフォルダはシステム起動時に自動作成された｢取込｣フォルダが初期表示されます。 \n \n \n \n \n \n \n \n \n \n \n｢サービス種類｣を選択します。 \n※ \n③でケアプランデータ連携を選択している場合、｢介護保険外｣は表示されません。 \n \n \n \n \n \n \n \n \n \n \n \n \n次ページに続きます \n \n \n \n3 \n4 \n｢前回特定した～｣のチェックは、前回の取り込\nみ時に｢事業所特定｣を行っている場合に使\n用します。 \n｢取込｣フォルダ(49 ページ参照)が初期表示されます。 \n※ フォルダ指定は前回値保持されます。", "images": ["images/ワイズマン__p60.png"]}, {"id": "ワイズマン__page61", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 61, "text": "60 \n \n事業所表示ボタンをクリックします。 \n \n｢事業所一覧｣に取込対象の事業所が表示されますので、 \n提供票の取り込みを行いたい事業所にチェックを付けます。 \n \n \n \n \n \n \n \n \n \n利用者表示ボタンをクリックします。 \n \n｢利用者一覧｣に取込対象の利用者が表示されます。 \n提供票を取り込みたい利用者にチェックを付けます。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n実行ボタンをクリックします。 \n \n \n \n本操作は以上です。 \n \n \n \n5 \n7 \n8 \n6", "images": ["images/ワイズマン__p61.png"]}, {"id": "ワイズマン__page62", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 62, "text": "61 \n \n \n提供票ファイルの保存先(取込フォルダ) \n \n \n[提供票取込]後、｢取込｣フォルダに格納した提供票ファイルは、自動的に各フォルダに整理(移動)\nされます。 \n※ 移動時に自動で以下のフォルダが作成されます。 \n \n取込フォルダ(例)  \n他法人の居宅介護支援事業所(事業所番号:0300000121)から受信したファイルを、 \n自法人のサービス提供事業所(事業所番号:0000000149)｣で取り込んだ場合。 \nc:\\ (C ドライブ) \n∟\n ASPWise \n∟\n SP \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 出力 \n∟\n 取込 \n∟\n 202506 予定 \n∟\n 0000000149_ワイズデイサービス \nUPKIHON_0300000121_43_0000000149_15_20250601123456.CSV \nUP1KYO_0300000121_43_0000000149_15_20250601123456.CSV \nUPHOSOKU_202504_0300000121_43_0000000149_15_20250601123456.CSV 等 \n \n \n \n \n \n  \n \n \n[提供票取込]画面の｢取込先：ケアプランデータ連携｣で \n指定したフォルダ \n提供票ファイル \nサービス提供年月ごとのフォルダ内に、事業所番号・事業所名ごとにフォルダを分けて \nファイルが移動されます。", "images": ["images/ワイズマン__p62.png"]}, {"id": "ワイズマン__page63", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 63, "text": "62 \n \n \n取り込んだ提供票ファイルを印刷する \n \n \n取り込んだ提供票ファイルを確認・印刷したい場合、[計画単位数・提供票一覧]画面、または［提\n供票一括印刷画面から印刷することができます。 \n \n操作 \n［計画単位数提供票一覧］から提供票を印刷する \n① \n[請求]－[計画単位数]－[計画単位数・提供票一覧]を開きます。 \n② \n対象の「対象年月」「サービス種類」を選択します。 \n③ \n一覧表示ボタンをクリックします。 \n④ \n該当の利用者にチェックを入れます。 \n⑤ \n印刷ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n⑥ 「帳票種類：サービス提供票」を選択し、 \n「出力対象」で印刷したい帳票にチェックを入れます。 \n⑦ \n印刷ボタンを押し、帳票を印刷します。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n2 \n3 \n4 \n5 \n6 \n7", "images": ["images/ワイズマン__p63.png"]}, {"id": "ワイズマン__page64", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 64, "text": "63 \n操作 \n［提供票一括印刷］から提供票を印刷する \n① \n[予定・実績]－[提供票]－[提供票一括印刷]画面を開きます。 \n② \n該当の対象年月を入力し、「取込先：ケアプランデータ連携」を選択します。 \n③ 「月間計画作成事業者」を選択します。 \n④ \n一覧表示ボタンをクリックします。 \n⑤ \n表示されている利用者一覧から、印刷する利用者にチェックを入れます。 \n⑥ \n印刷ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n⑦ \n印刷したい帳票を「出力対象」から選択します。 \n⑧ \n印刷ボタンを押し、帳票を印刷します。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n本操作は以上です。 \n2 \n3 \n4 \n5 \n6 \n7 \n8 \n［提供票取込］画面で取り込んだ提供票情報のCSV 内に他事業所分の情報が含まれている場合、\nその内容も併せて取り込まれ、本操作で確認・印刷が可能です。 \n■例", "images": ["images/ワイズマン__p64.png"]}, {"id": "ワイズマン__page65", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 65, "text": "64 \n \n \n 削除ファイルを取り込んで提供票情報を削除する \n \n \n \n削除ファイルを取り込んで提供票情報を削除する場合は、以下の方法で操作します。 \n \n操作 \n削除ファイルを取り込む \n① 「取込先」フォルダに「DLTPLAN」から始まる削除ファイルを投稿してください。 \n② 「対象年月」を設定します。 \n③ 「取込先」で「ケアプランデータ連携」を選択します。 \n④ \n事業所表示ボタンをクリックします。 \n※ \n取込可能な削除ファイルが投稿されている場合、削除ファイル取込ボタンがピンク\n色に変わります。 \n \n \n \n \n⑤ \n削除ファイル取込ボタンをクリックします。 \n⑥ \n削除を行うファイルの選択列にチェックを付けます。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n⑦ \n利用者表示ボタンをクリックします。 \n⑧ \n実行ボタンをクリックします。 \n⑨ 「削除ﾌｧｲﾙの取込を実行してもよろしいですか？」のメッセージが表示されます。 \n⑩ 「削除ﾌｧｲﾙの取込が完了しました。実行結果列を確認してください。」のメッセージが \n表示されます。 \n⑪ \n実行結果列で実行結果をご確認ください。 \n \n \n \n \n \n本操作は以上です。 \n \n5 \n6 \n11 \n7 \n8", "images": ["images/ワイズマン__p65.png"]}, {"id": "ワイズマン__page66", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 66, "text": "65 \n \n \n \n 介護支援専門員番号は取り込まれません。 \n \n \n \n｢ケアプラン標準仕様｣の提供票ファイルには、介護支援専門員番号が設定されていません。そ\nのため提供票取込時に利用者全員について、毎回、｢計画作成担当者のサービス関係者マスター\nが存在しません。｣の警告が表示されます。 \n警告メッセージのため、そのまま取り込みできます。 \n※ 取込実行後に[計画単位数・提供票一覧]の画面で計画作成担当者を登録してください。 \n    \n \n \n 「計画単位数を含む」の設定について \n \n \n \n「計画単位数を含む」に✔をつけずに提供票取込を実行すると、[計画単位数・提供票一覧]画面\nから出力したサービス提供票別表の「区分支給限度基準を超える単位数」に「区分支給限度基\n準内単位数」の数字が計上されます。 \n「計画単位数を含む」に✔をつけない場合、計画単位数が0 として扱われるため、 \n実際の単位数がすべて区分支給限度基準を超える単位数として表示されます。 \n実際の単位数を区分支給限度基準内単位数として表示する場合は、「計画単位数を含む」を選択し、\n提供票取込を再実行してください。 \n \n \n \n \n 住所地特例対象の利用者について、提供票取込後に保険者の確認・訂正を行ってください。\n \n \n \n住所地特例のサービスについて、サービス提供事業所で計画を取り込むと、[利用者台帳(介護\n保険)]の保険者のサービスとして取り込まれます。 \n提供票取込の後、[計画単位数・提供票一覧]－[提供票詳細入力・訂正]で｢保険者番号｣を確認の\n上、施設所在地の｢保険者番号｣へ訂正してください。 \n【該当するサービス種類】 \n・ 71:夜間対応型訪問介護 \n・ \n72／74:(介護予防)認知症対応型通所介護 \n・ 78:地域密着型通所介護 \n・ \n76:定期巡回・随時対応型訪問介護看護 \n・ 73／75:(介護予防)小規模多機能 ・ \n77:看護小規模多機能 \n・ A2～A8 の総合事業サービス \n \n \n \n \n 76:訪問介護看護の｢ケア種別｣の取り扱いについて \n \n \n \n｢ケアプランデータ連携標準仕様｣の提供票ファイルには、｢ケア種別｣(介護／看護／介護・看護)の \n情報が含まれていないため、提供票取込時に以下の通りケア種別が設定されます。 \n・ 報酬体系｢一体型｣のサービスコード(定期巡回随時Ⅰ)→ ケア種別｢介護・看護｣ \n・ 報酬体系｢連携型｣のサービスコード(定期巡回随時Ⅱ)→ ケア種別｢介護｣", "images": ["images/ワイズマン__p66.png"]}, {"id": "ワイズマン__page67", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 67, "text": "66 \n \n \n 73/75:(介護予防)小規模多機能、77:看護小規模多機能について \n \n \n \n｢ケアプランデータ連携標準仕様標準仕様｣の提供票ファイルには、月額または日割りの単位数\n情報のみが出力されており、｢ケア種別｣(通い／泊まり／訪問／訪問看護)の情報は含まれてい\nません。 \n提供票取込をすると、契約期間のみが取り込まれ、｢ケア種別｣の内訳がない状態となります。\nそのため、予定反映はできません。", "images": ["images/ワイズマン__p67.png"]}, {"id": "ワイズマン__page68", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 68, "text": "67 \n  \n▶老健、通所訪問リハ、老福、短期入所、地福、訪看、ヘルパー、デイ、訪問入浴、GH、小多機 \n \n \n \n地域包括支援センターから居宅介護支援事業所に計画作成を委託している利用者について \n[利用者台帳(連絡先)]の情報を参照して作成区分・計画作成事業者が取り込まれます。 \n \n \n \n委託利用者の場合は、事前に[利用者台帳(連絡先)]で｢(委託先)介護支援事業所｣と｢地域包括支援セ\nンター｣を登録してください。 \n以下の条件に該当する場合、[計画単位数・提供票一覧]の作成区分｢介護予防｣として取り込まれま\nす。また、計画作成事業者には、[利用者台帳(連絡先)]に登録されている｢地域包括支援センター｣\nが取り込まれます。 \n・ サービス種類が介護予防または総合事業。 \n・ 提供票ファイルの計画作成事業所が、[利用者台帳(連絡先)]に登録されている｢(委託先)介\n護支援事業所｣と一致している。 \n・ [利用者台帳(連絡先)]に｢地域包括支援センター｣が登録されている。 \n \n※ ｢ケアプランデータ連携標準仕様｣の提供票ファイルには委託情報が存在しないため、事前\nに[利用者台帳(連絡先)]を登録していない場合、委託利用者の場合でも｢作成区分：居宅介\n護｣、｢計画作成事業者：居宅介護支援事業所｣として取り込まれます。 \n※ 委託利用者かつ、月途中で介護⇔予防の区分変更がある場合は、提供票取込後に作成区\n分・計画作成事業者の確認・修正を行ってください。", "images": ["images/ワイズマン__p68.png"]}, {"id": "ワイズマン__page69", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 69, "text": "68 \n \nSTEP4 提供実績を確定する \n \n \n [予定・実績]－[提供実績]－[提供票実績・確定] \nサービス提供事業所向けシステムで、対象利用者の提供実績を確定します。 \n \n先に「STEP3」の提供票ファイル取込を行う必要があります。 \n \n \n操作 \n提供実績を確定する \n \n \n \n「対象年月」を設定します。 \n \n「適用制度」を選択します。 \n \n \n \n \n \n \n \n「サービス種類」を選択します。 \n※ \nCH、有料、サ高住の場合、③の手順は飛ばします。 \n \n \n \n \n \n \n提供票作成事業者で絞り込む場合、提供票作成事業者を選択します。 \n \n一覧表示ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n次ページに続きます \n \n4 \n3 \n2 \n5", "images": ["images/ワイズマン__p69.png"]}, {"id": "ワイズマン__page70", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 70, "text": "69 \n \n対象の利用者にチェックを付けます。 \n※ \nケアプランデータ連携で取り込んだ利用者には、｢提供票作成経路｣の欄に｢ケアプラン \nデータ連携｣と記載されます。 \n \n実行ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n本操作は以上です。 \n \n \n \n6 \n7", "images": ["images/ワイズマン__p70.png"]}, {"id": "ワイズマン__page71", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 71, "text": "70 \n \nSTEP5 提供実績をファイル出力する \n \n \n \n [予定・実績]－[提供実績]－[提供実績ファイル出力] \nサービス提供事業所向けシステムで、提供実績ファイルを出力します。 \n \n先に「STEP3」の提供票ファイル取込、「STEP4」の提供実績確定を行う必要があります。 \n \n \n操作 \n提供実績をファイル出力する \n \n \n \n「対象年月」を設定します。 \n \n「出力先」を選択します。 \n※ \nフォルダはシステム起動時に自動作成された｢出力｣フォルダが初期表示されます。 \n \n \n \n \n \n \n \n \n \n \n \n「サービス」種類を選択します。 \n※ \n適用制度が表示されるシステムをご利用の場合は、適用制度を選択します。 \n \n事業所表示ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n次ページに続きます \n \n \n \n2 \n3 \n4 \n｢出力｣フォルダ(49 ページ参照)が \n初期表示されます。 \n※ フォルダ指定は前回値保持されます。", "images": ["images/ワイズマン__p71.png"]}, {"id": "ワイズマン__page72", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 72, "text": "71 \n \n｢事業所一覧｣で対象の事業所にチェックを入れます。 \n \n利用者表示ボタンをクリックします。 \n \n \n \n \n \n \n \n \n \n \n実行ボタンをクリックします。 \n \n出力されたファイルを確認する。 \n※ \n出力されるCSV ファイル \nファイル名 \nファイルの内容 \n備考 \nUPJSK… \n提供実績 \n― \n例｜UPJSK_202506_0000000149_15_0300000121_43_20250630173055.CSV \n└対象年月  └自事業所の   └居宅介護支援事業所の  └出力日時 \n事業所番号       事業所番号 \n \n※ \n出力されたCSV ファイルの中身を確認する必要がある場合は、Excel は使用せず、メモ帳などの\nテキストエディタをご利用ください(Excel を使用した場合、ファイルの中身が崩れてしまう場合\nがあります) \n \n \n \n \n本操作は以上です。 \n \n \n \n5 \n6", "images": ["images/ワイズマン__p72.png"]}, {"id": "ワイズマン__page73", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 73, "text": "72 \n \n \n提供実績ファイルの出力先(出力フォルダ) \n \n \n[提供実績 ファイル出力]時、｢出力｣フォルダ内に出力される提供実績ファイルは、 \n自動的に各フォルダに整理して格納されます。 \n※ 自動で以下のフォルダが作成されます。 \n \n出力フォルダ(例) \n 他法人の居宅介護支援事業所(事業所番号:0300000121)に送信する提供実績ファイルを、 \n自法人のサービス提供事業所(事業所番号:0000000149)｣で出力した場合。 \nc:\\ (C ドライブ) \n∟\n ASPWise \n∟\n SP \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 取込 \n∟\n 出力 \n∟\n 2025 年06 月30 日17 時30 分55 秒 実績 \n∟\n 0000000149_ワイズデイサービス \nUPJSK_202506_0000000149_15_0300000121_43_20250630173055.CSV 等 \n \n \n \n \n \n \n \n 短期入所系サービスの30 日超過日の情報について \n \n \n \n弊社システム製品から出力した提供実績ファイルには、[請求]－[計画単位数]－[計画単位数・\n提供票一覧]で設定した30 日超過日(自費利用となる日)の情報は反映されません。そのため、\n30 日超過日当日の実績は、30 日超過日としてではなく、保険給付対象の実績として出力され\nます。 \n短期入所の連続利用が自費利用を挟み30 日を超える利用者がいる場合は、必要に応じてケアプ\nラン作成事業所に電話等で30 日超過日について連絡をしてください。 \n \n \n \n \n[提供実績 ファイル出力]画面の｢出力先：ケアプランデータ連携｣で\n指定したフォルダ \n提供実績ファイル \nサービス提供年月日、出力時間ごとのフォルダ内に、 \n事業所番号・事業所名ごとにフォルダを分けてファイルが格納されます。", "images": ["images/ワイズマン__p73.png"]}, {"id": "ワイズマン__page74", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 74, "text": "73 \n \nSTEP6 ケアプラン作成事業所に提供実績ファイルを送付する \n \n国保中央会｢ケアプランデータ連携システム｣等を介して、ケアプラン作成事業所に \n提供実績ファイルを送付します。 \n \n \n｢ケアプランデータ連携システム｣を介してデータ送信する場合は、提供実績ファイルを｢ケアプラン\nデータ連携クライアント｣にアップロードして送信してください。 \n \n｢ケアプランデータ連携クライアント｣の操作方法は、国保中央会提供の操作マニュアル等を参照して\nください。ご不明点は、国保中央会にお問い合わせください。 \n \n \n \n \n \n \n送付済みデータを取り下げたい利用者がいる場合は、連携先の事業所に電話等で連絡を\nしてください。 \n \n \n \n｢ケアプランデータ連携標準仕様｣で提示されているファイルレイアウトのうち、｢削除情報ファ\nイル｣の出力にはSP システムは対応していません。何らかの理由で送付済みの提供実績を取り\n下げる利用者がいる場合は、ケアプラン作成事業所に電話等で連絡をしてください。 \n \n※ ｢削除情報ファイル｣とは、何らかの理由で送信済みの提供実績を取り下げる場合に送信す\nるファイルです。｢ケアプランデータ連携標準仕様｣では、必ずしも取り下げ時に削除情報\nファイルを送信する必要はなく、取り下げ先の事業所に電話等で連絡し、オフラインで計\n画書の取り下げをする運用も可能とされています。 \n \n \n \n本操作は以上です。", "images": ["images/ワイズマン__p74.png"]}, {"id": "ワイズマン__page75", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 75, "text": "74 \n \n運用のポイント｜｢ケアプランデータ連携システム｣を介してデータ送受信をする場合 \n \n国保中央会｢ケアプランデータ連携システム｣を介してデータ送受信する場合の、運用時のポイン\nトは下表の通りです。 \n \n \n｢ケアプランデータ連携クライアント｣のインストール方法・操作方法は、国保中央会提供の操作マニ\nュアル等を参照してください。ご不明点は、国保中央会にお問い合わせください。 \n \n項目 \n説明 \n｢ケアプランデ一タ連携クライアント｣を \nインストールするPC \nワイズマンシステムを使用しているPC に｢ケアプランデ一タ連携クライアント｣\nをインストールすると、送信時のファイル添付作業をスムーズに行えます。 \nよく使用するフォルダ \n \n*｢ケアプランデ一タ連携クライアント｣でファイル \n 送受信するフォルダ \n*ワイズマンシステムでファイル出力・取込する \n フォルダ \nよく使用するフォルダのショートカットを、デスクトップなどの分かりやすい場所に\n作成すると、ファイル選択の操作が簡単になります。 \n※ ファイル選択画面で①デスクトップを選択→②作成したショートカットを\n選択、2 ステップで対象ファイルが表示されるようになります。 \n※ 作成したショートカットは、任意の名前に変更できます。 \n \n■デスクトップにショートカットを作成する方法 \nWindows11 の場合 \n①ショートカットを作成するフォルダを右クリックします。 \n②表示されたメニューで、[その他のオプションを表示]→[送る]→ \n[デスクトップ(ショートカットを作成)]の順にクリックします。 \n③デスクトップにショートカットアイコンが作成されたことを確認します。 \n \nWindows10 の場合 \n①ショートカットを作成するフォルダを右クリックします。 \n②表示されたメニューで、[送る]→[デスクトップ(ショートカットを作成)] \nの順にクリックします。 \n③デスクトップにショートカットアイコンが作成されたことを確認します。", "images": ["images/ワイズマン__p75.png"]}, {"id": "ワイズマン__page76", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 76, "text": "75 \n例 \n活用 \nそのほかの機能で居宅サービス計画等を参照する \n \n \n アップデート版システムをお使いの場合 \n \n [利用者の管理]－[サマリー]－[サマリー] \n[記録管理]－[個別援助計画/療法士支援]－[リハビリ実施計画書] \n[記録管理]－[機能訓練計画/療法士支援]－[機能訓練実施計画書] \n[記録管理]－[個別援助計画]－[個別機能訓練計画書] \n \n｢ケアプランファイル取込｣にて取り込んだ居宅サービス計画等を参照しながら、サマリー\nやリハビリ／機能訓練実施計画書を作成できます。 \n \n \n操作 \n居宅サービス計画等を参照表示する \n \n \n \n \nサマリーで｢居宅サービス計画書｣を参照表示する \n \n \n｢参照情報を表示する｣にチェックを付けると、画面左部に｢利用者基本情報／計画書／週間\n計画｣を表示できます。 \n※ \n[サマリー]機能で説明しますが、他の機能でも同様に操作します。以降の操作も同様です。 \n \n \n  \n \n参照情報を表示する \nチェックを付けると、以下のボタンが表示されます。 \nクリックすると、画面左部にその内容が表示されます。 \n・ \n利用者基本情報(ケアプラン連携)ボタン \n・ \n計画書(ケアプラン連携)ボタン \n・ \n週間計画(ケアプラン連携)ボタン \n履歴ボタン \n表示する居宅サービス計画等の履歴を選択できます。 \n印刷ボタン ※次ページ参照 \n複数ページの場合、 \nシートを切り替えて確認します。 \n左部と右部の区切り部分をマウスでドラッグすると、 \n入力画面の表示枠を変更できます。 \n計画書が見にくいときは表示枠を広げてください。", "images": ["images/ワイズマン__p76.png"]}, {"id": "ワイズマン__page77", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 77, "text": "76 \n例 \n例 \n \n操作 \n居宅サービス計画等を印刷する \n \n \n \n \nサマリーで｢居宅サービス計画書｣を印刷する \n \n \n画面左部に表示した居宅サービス計画等は、印刷ボタンから印刷ができます。 \n \n \n \n \n操作 \n居宅サービス計画等からコピーして貼り付ける \n \n \n \n \nサマリーで｢居宅サービス計画書｣をコピーしてフェースシートに貼り付ける \n \n \n画面左部の各項目で右クリックすると、居宅サービス計画等からコピーしてサマリー等を作\n成できます。 \n \n \n \n \n以下の2 つの方法でコピー・貼り付けの操作が行えます。 \nコピー \n左部でコピーしたい内容を選択して右クリック｢コピー｣を選択します。\n右部の貼り付けたい場所で右クリック｢貼り付け｣を選択します。 \n \nシートへ貼り付け \n先に右部で貼り付けたい場所をクリックします。左部でコピーしたい\n内容を選択して右クリック｢シートへ貼り付け｣を選択します。", "images": ["images/ワイズマン__p77.png"]}, {"id": "ワイズマン__page78", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 78, "text": "77 \n \n [記録管理]－[個別援助計画]－[個別機能訓練計画書(1)]/[個別機能訓練計画書(2)] \n \n｢ケアプランファイル取込｣にて取り込んだ居宅サービス計画を、個別援助計画(介護計画\n1)に取り込みできます。 \n｢ケアプランファイル取込｣にて取り込んだ週間計画を参照しながら、個別援助計画(介護計\n画2)を作成できます。 \n \n \n操作 \n個別援助計画(介護計画1)に居宅サービス計画を取り込む \n \n \nケアプラン取込ボタンをクリックすると、｢ケアプランファイル取込｣にて取り込んだ居宅サ\nービス計画も画面上部に表示されます。 \n一覧表示ボタンをクリック後、個別援助計画に取り込む計画を選択してください。 \n※ \n法人内の事業所で作成した居宅サービス計画等から取り込む場合と同様の操作です。 \n \n \n \n \n \n \n法人内の事業所で作成した居宅サービス計画等に加え、 \n｢ケアプランファイル取込｣にて取り込んだデータが表示されます。", "images": ["images/ワイズマン__p78.png"]}, {"id": "ワイズマン__page79", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 79, "text": "78 \n \n操作 \n週間計画を参照しながら個別援助計画(介護計画2)を作成する \n \n \n｢参照情報を表示する｣にチェックを付けると、画面左部に｢週間計画｣を表示できます。 \n表示された週間計画は、テキスト入力欄へのコピー・貼り付けが可能です。 \n \n \n \n \n \n参照情報を表示する \nチェックを付けると、画面左部に｢ケアプランファイル取込｣にて取り込んだ\n週間計画が表示されます。 \n履歴ボタン \n表示する週間計画の履歴を選択できます。 \n右クリックメニュー｢コピー｣ \n週間計画からテキストをコピーできます。 \n[本人及び家族の意向・希望]タブ、[週間計画]タブのテキスト入力欄に\n貼り付けできます。", "images": ["images/ワイズマン__p79.png"]}, {"id": "ワイズマン__page80", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 80, "text": "79 \n \n \n運用イメージと操作の流れ \n \n \n \n｢ケアプランデータ連携標準仕様｣による、ケアプランデータ連携の運用イメージ \n \n \n｢ケアプランデータ連携標準仕様｣で作成されたケアプランデータを、ケアプラン作成事業所\nと連携する場合の運用イメージは、下図の通りです。 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n4 サービス提供事業所向けシステム \n〔メディカル介護システム〕 \n \n本章では、弊社サービス提供事業所向けシステムのうち「メディカル介護システム」の操作をご説明します。 \n取\n込 \n出\n力 \n提供実績 \n \n \ncsv \nサービス提供事業所｜ワイズマン メディカル介護システム \n \nケアマネシステムからの計画入力および実績出力（ファイル連携）]画面の ファイル作成・取込ボタンから開く機能 \n提供票取込 \n[提供票]－[提供票ファイル取込(ケアプランデータ連携標準仕様)] \n提供実績出力 \n[提供票]－[提供実績ファイル書込(ケアプランデータ連携標準仕様)] \n \n居宅サービス計画書／サービス提供票の出力と、提供実績の取込を行います。 \nケアプラン作成事業所 \n国保中央会｢ケアプランデータ連携システム｣等を介して、ケアプランデータ送受信 \n出\n力 \n取\n込 \n提供票・別表 \n提供票(利用票)、別表、 \n利用者補足情報 \n \n居宅サービス計画書 \n第1 表、第2 表、第3 表 \n利用者補足情報 \n \n介護予防サービス・支援計画書 \n介護予防サービス・支援計画書、別表 \n  \n利用者基本情報 \n利用者基本情報、別表1、別表2、 \n家族構成画像 \n  \n削除情報(必要時のみ) \ncsv \ncsv \ncsv \ncsv \ncsv \njpg", "images": ["images/ワイズマン__p80.png"]}, {"id": "ワイズマン__page81", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 81, "text": "80 \n \n \n操作の流れ \n \n \n \n \n初回のみの操作 ～取込・出力に使用するフォルダの確認～ \n \n \nケアプランデータ連携システムを介したデータの取込・出力を行う前に、使用するフォルダ\nを確認してください。必要なフォルダは、機能の起動時に自動で作成されます。 \n \n \n操作 \n取込／出力フォルダを確認する \n \n \n \nシステム選択メニューで[メディカル介護（メディカル ファイル連携）]をクリックし\nます。 \n※ \nオンプレミス版をご利用の場合は、スタートメニューから[サービス提供票 取込 書込 FD\n／トベッキー]を起動します。 \n \n \n \n表示された画面で、ファイル取込・作成ボタンをクリックします。 \n \n \n \n表示された画面で[提供票]メニューをクリックし、ファイル取込や作成を行う機能を起\n動します。 \n・取込に使用する機能 ｜ [提供票ファイル取込(ケアプランデータ連携標準仕様)] \n・出力に使用する機能 ｜ [提供実績ファイル書込(ケアプランデータ連携標準仕様)] \n \n \n \n \n \n次ページに続きます \n \n \n2 \n3", "images": ["images/ワイズマン__p81.png"]}, {"id": "ワイズマン__page82", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 82, "text": "81 \n \n表示された画面で、使用するフォルダを確認します。 \n※ \nワイズマンASP サービスをご利用の場合、お使いのコンピュータのC ドライブは、システ\nム画面上 『V ドライブ（V:\\）』 と表示されます。 \n※ \nオンプレミス版の場合は、システムの起動フォルダ直下に作成されます（例｜「C:\\IJI」など）。 \n \n■[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面｜取込フォルダ \nケアプラン作成事業所から受け取ったケアプランデータを保存するフォルダです。 \n \n \n \n■[提供実績ファイル書込(ケアプランデータ連携標準仕様)]画面｜書込フォルダ（出力フォルダ） \nケアプラン作成事業所へ送付する提供実績をファイル出力するフォルダです。 \n \n \n \n \n \n本操作は以上です。 \n \n \n \n \n 取込フォルダ・出力フォルダ \n \n \n \n取込フォルダは[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面、出力フォルダは[提供\n実績ファイル書込(ケアプランデータ連携標準仕様)]画面の起動時に、それぞれ作成されます。 \n※ ワイズマンASP サービスをご利用の場合、お使いのコンピュータのC ドライブはシステム\n画面上 『V ドライブ（V:\\）』 と表示されます。 \n※ ワイズマンシステムSP と本システムでは、取込／出力フォルダが異なります。 \n \nC:\\ (C ドライブ) \n∟\n ASPWise \n∟\n Iji \n∟\n ケアプランデータ連携標準仕様 \n∟\n 取込 \n∟\n 出力 \n \n \n出力フォルダ \nV:\\ASPWise\\IJI\\ケアプランデータ連携標準仕様\\出力 \n取込フォルダ \nV:\\ASPWise\\IJI\\ケアプランデータ連携標準仕様\\取込 \nC:\\ASPWise\\IJI\\ケアプランデータ連携標準仕様", "images": ["images/ワイズマン__p82.png"]}, {"id": "ワイズマン__page83", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 83, "text": "82 \n \n \n毎月の操作 \n \n \nケアプランデータを取り込む \nケアプラン作成事業所からケアプランデータ（居宅サービス計画書等・提供票等のファイ\nル）を受け取ったら、｢居宅サービス計画の確認｣、と｢提供票ファイルの取込｣を行います。 \n※ \n提供票データの登録以降は、従来のシステム操作と同様です。 \n \n \nSTEP1 \nケアプラン作成事業所からファイルを受け取る ···································· 83 ページ \n \n \n \n \n \n \nSTEP2 \nケアプラン作成事業所からファイルを取り込む ···································· 86 ページ \n \n \n \n[提供票]－[提供票ファイル取込(ケアプランデータ連携標準仕様)] \n \n \nSTEP3 \n居宅サービス計画書等を表示・印刷する ············································· 91 ページ \n \n \n \n[提供票]－[提供票ファイル取込(ケアプランデータ連携標準仕様)] \n \n \nSTEP4 \n提供票データを登録する ································································· 95 ページ \n \n \n \n[メディカル ファイル連携] \n－[ケアマネシステムからの計画入力および実績出力(ファイル連携)] \n \n提供実績ファイルを出力する \n当月の実績が確定したら、提供実績ファイルの出力を行います。 \n出力した提供実績ファイルは、ケアプラン作成事業所に送付します。 \n \n \nSTEP5 \n提供実績をファイル出力する ··························································· 99 ページ \n \n \n手順1 \n提供実績を書き出す \n99 ページ \n \n \n \n[メディカル ファイル連携] \n－[ケアマネシステムからの計画入力および実績出力(ファイル連携)] \n \n \n手順2 \n提供実績ファイルを出力する \n101 ページ \n \n \n \n[提供票]－[提供実績ファイル書込(ケアプランデータ連携標準仕様)] \n \n \nSTEP6 \nケアプラン作成事業所に提供実績ファイルを送付する ···························· 105 ページ", "images": ["images/ワイズマン__p83.png"]}, {"id": "ワイズマン__page84", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 84, "text": "83 \n例 \n毎月の操作 \n \n・ ケアプラン作成事業所からファイルを受け取ったら、｢居宅サービス計画の確認｣と｢提供票データの登\n録｣を行います。 \n・ 当月の実績が確定したら、提供実績ファイルの出力を行います。出力した提供実績ファイルは、ケア\nプラン作成事業所に送付します。 \n \nSTEP1 ケアプラン作成事業所からのファイルを受け取る \n \nケアプラン作成事業所から送信されたケアプランデータのファイルを受け取ります。受け\n取ったファイルは、｢ケアプランデータ連携標準仕様｣によるデータ連携を行うコンピュー\nタの｢ケアプランデータ連携標準仕様｣フォルダ内、｢取込｣フォルダに投稿します。 \n \n \n｢ケアプランデータ連携システム｣を介してデータ受信する場合は、ケアプラン作成事業所から送信 \nされたCSV ファイルを｢ケアプランデータ連携クライアント｣でダウンロードしてください。 \n \n｢ケアプランデータ連携クライアント｣の操作方法は、国保中央会提供の操作マニュアル等を参照して\nください。ご不明点は、国保中央会にお問い合わせください。 \n \n \n操作 \n取込用フォルダに投稿する \n \n \n \n \n国保中央会｢ケアプランデータ連携システム｣を介して、データ送受信する場合 \n \n \n \n国保中央会｢ケアプランデータ連携クライアント｣で、CSV ファイルをダウンロードします。 \n※ \nCSV ファイルの種類は次ページ参照。 \n \n①でダウンロードしたファイルをすべて、あらかじめ確認した「ケアプランデータ連携\n標準仕様」フォルダ内の取込フォルダ（81 ページ参照）に投稿します。 \n※ \n連携先ケアプラン作成事業所が複数ある場合 \n→ケアプラン作成事業所ごとにフォルダを分けて投稿する必要はありません。 \n \nC:\\ (C ドライブ) \n∟\n ASPWise \n∟\n Iji \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 取込 \n∟\n 出力 \n \n \n \n本操作は以上です。 \n \n \n取込フォルダ \nC:\\ASPWise\\IJI\\ケアプランデータ連携標準仕様\\取込", "images": ["images/ワイズマン__p84.png"]}, {"id": "ワイズマン__page85", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 85, "text": "84 \nケアプラン作成事業所から送付されるCSV ファイル \n「ケアプランデータ連携システム」からダウンロードして取込フォルダに保存するCSV ファ\nイルは、サービス提供年月・ケアプランデータ作成事業所・事業所番号・サービス種類など\nにより複数に分かれています。 \n \nファイル名 \nファイルの内容 \n備考 \n 1  居宅サービス計画書用ファイル \nUPHOSOKU… \n利用者補足情報 \n計画取込時 必須 \nUP1KYO… \n居宅サービス第1 表 \n計画取込時 必須 \nDLT1KYO… \n居宅サービス第1 表_削除 \n任意(削除時に必要) \nUP2KYO… \n居宅サービス第2 表 \n第1 表と併せて取込 \nUP3KYO… \n居宅サービス第3 表 \nUPKIHON… \n利用者基本情報 \n \nDLTKIHON… \n利用者基本情報_削除 \n任意(削除時に必要) \nUPKIHON… \n利用者基本情報（別表1） \n \nUPKIHON… \n利用者基本情報（別表2） \n \nUPYOBO… \n介護予防サービス・支援計画書 \n \nDLTYOBO… \n介護予防サービス・支援計画書_削除 \n任意(削除時に必要) \nUPYOBO_SUB… \n介護予防サービス・支援計画書（別表）\n支援計画 \n \n 2  提供票用ファイル \nUPHOSOKU… \n利用者補足情報 \n提供票取込時 必須 \nUPPLAN… \n第6 表情報 \n提供票取込時 必須 \nDLTPLAN… \n第6 表情報_削除 \n任意(削除時に必要) \nUPSIKYU… \n第7 表情報 \n第6 表と併せて取込 \n※ \n出力されたCSV ファイルの中身を確認する必要がある場合は、Excel は使用せず、メモ帳な\nどのテキストエディタをご利用ください(Excel を使用した場合、ファイルの中身が崩れてし\nまう場合があります)。 \n \n \n「取込フォルダ」への投稿イメージ \nダウンロードしたCSV ファイル（これから取り込むファイル）は、取込フォルダの直下に\n投稿します。連携先ケアプラン作成事業所や提供するサービス種類が複数ある場合でも、フ\nォルダを分けて投稿する必要はありません。 \n具体的なイメージは次ページを参照してください。", "images": ["images/ワイズマン__p85.png"]}, {"id": "ワイズマン__page86", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 86, "text": "85 \n \n例｜他法人の居宅介護支援事業所(事業所番号: 0300000007)から受信したファイルを、 \n自法人のサービス提供事業所(事業所番号: 03B0000503)のフォルダに投稿する場合 \n  ※受信日時：2025 年4 月20 日12 時34 分56 秒 \n取込フォルダ \nC:\\ (C ドライブ) \n∟\n ASPWise \n∟\n Iji \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 出力 \n∟\n 取込 \n 1  \nUPHOSOKU_000000_0300000007_43_03B0000503_16_20250420123456.CSV \nUPHOSOKU_000000_0300000007_46_03B0000503_66_20250420123456.CSV \nUP1KYO_0300000007_43_03B0000503_16_20250420123456.CSV \nUP1KYO_0300000007_46_03B0000503_66_20250420123456.CSV \nUP2KYO_0300000007_43_03B0000503_16_20250420123456.CSV \nUP2KYO_0300000007_46_03B0000503_66_20250420123456.CSV \n \n \n \n \n \n \n \n 2  \nUPHOSOKU_202505_0300000007_43_03B0000503_16_20250420123456.CSV \nUPPLAN_202505_0300000007_43_03B0000503_16_20250420123456.CSV \nUPSIKYU_202505_0300000007_43_03B0000503_16_20250420123456.CSV \n \n \n \n \n \n \n \n \n 1  居宅サービス計画書用ファイル \n \nUP1KYO_0300000007_43_03B0000503_16_20250420123456.CSV \n└居宅介護支援事業所の    └自事業所の            └ファイル連番 \n事業所番号とサービス種類    事業所番号とサービス種類 \n 2  提供票用ファイル \n \nUPPLAN_202505_0300000007_43_03B0000503_16_20250420123456.CSV \n└サービス  └居宅介護支援事業所の  └自事業所の            └ファイル連番 \n提供年月   事業所番号とサービス種類  事業所番号とサービス種類", "images": ["images/ワイズマン__p86.png"]}, {"id": "ワイズマン__page87", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 87, "text": "86 \nSTEP2 ケアプラン作成事業所からのファイルを取り込む \n \n \n [提供票]－[提供票ファイル取込(ケアプランデータ連携標準仕様)] \n取込フォルダに投稿したケアプランデータのファイル（居宅サービス計画書・提供票等）\nを、「メディカル介護システム」に取り込みます。 \n \n \nSTEP2 で取り込んだファイルは、居宅サービス計画書等の表示・印刷（STEP3）や提供票データの\n登録（STEP4）で使用します。 \n \n当月のケアプランを変更・削除するために複数回取り込む場合は、98 ページの注意点を参照してく\nださい。 \n \n機能の起動方法 \n \nシステム選択メニューの「メディカル介護（メディカル ファイル連携）」をクリック。 \n※ \nオンプレミス版をご利用の場合は、スタートメニューから[サービス提供票 取込 書込 FD\n／トベッキー]を起動します。 \n \n[ケアマネシステムからの計画入力および実績出力（ファイル連携）]画面上部の \nファイル取込・作成ボタンをクリック。 \n \n表示された画面で [提供票]－[提供票ファイル取込(ケアプランデータ連携標準仕様)]を\n起動。 \n \n \n \n3 \n2", "images": ["images/ワイズマン__p87.png"]}, {"id": "ワイズマン__page88", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 88, "text": "87 \n \n操作 \nケアプランデータのファイルを取り込む \n \n \n \n[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面を開きます（前ページ参照）。 \n \n対象年月（サービス提供年月）・STEP1 で指定した取込フォルダ（83 ページ参照）を\n指定します。 \n \n事業所表示ボタンをクリックします。 \n \n \n \n取り込むケアプランデータのファイルが一覧に表示されます。「備考」列が『○』にな\nっていることを確認してください。 \n※ 「備考」列が『○』以外の場合は見直しが必要なため、左側のチェックボックスは使用できません。 \n \n \n \n \n \n \n 「備考」列が『○』以外の場合 \n \n \n \n「備考」列が『○』以外の場合は、データの内容を特定できないため取込できません。メッセージ\nに応じて、メディカル介護システムの登録や取り込むファイルの見直しを行ってください。 \n＜見直し前の表示＞ \n \n＜見直し後の表示＞ \n \n \n \n \n \n \n次ページに続きます \n \n \n2 \n3 \n備考 \n1 行ずつ選択して画面上部の事業所特定ボタンをクリックする\nと、さらにメッセージ（見直し内容）を確認できます。 \n・ フォルダ指定は前回値保持されます。 \n・ ASP サービスをご利用の場合、コンピュータ\nのC ドライブは『V:\\』と表示されます。 \n・ 取込可能になった行は、備考欄が『○』に変わり、選択のチェックを\n付けられるようになります。 \n・ 見直し後、別のエラーに該当している場合は、備考欄の表示が変わ\nります。 \n（右側にスクロールしてメッセージ内容を確認） \n4", "images": ["images/ワイズマン__p88.png"]}, {"id": "ワイズマン__page89", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 89, "text": "88 \n \n「備考」列が『○』の行に選択のチェック（左列）を付け、対象者表示ボタンをクリッ\nクします。 \n \n取り込むケアプランデータのファイルに含まれる利用者が、一覧に表示されます。 \n「取込前」列が『可』になっていることを確認してください。 \n※ 「取込前」列が『可』以外の利用者は、対象者を特定できないため取込できません。 \n \n \n \n \n \n 「取込前」列が『可』以外の場合 \n \n \n \n「取込前」列が『可』以外の場合は、メッセージを確認のうえ対象者を特定してください。 \n \nメッセージ \n説明 \n該当者不在 \nCSV ファイル内の保険者番号・被保険者番号と一致する患者台帳が\nない場合に表示。 \n画面上部の台帳未登録ボタンから患者を登録する、または、対象者の\n介護保険認定情報を確認してください。 \n該当者が複数 \nCSV ファイル内の保険者番号・被保険者番号と一致する患者台帳が\n複数ある場合に表示。 \n画面右側の対象者特定ボタンから患者を特定する、または、対象者の\n介護保険認定情報を確認してください。 \n同一利用者で同じサービス種類の\nデータは取込できません。 \n1 つのCSV ファイル内で、同一利用者に複数の介護保険情報が含ま\nれている場合に表示（保険者変更、生活保護単独→併用への変更 \nなど）。 \n対象者の介護保険認定情報について、ケアプラン作成事業所へご確認\nください。 \n※ CSV ファイルの内容に不備がある場合は、その内容が表示されます（項目数が不正、など）。 \n \n \n \n次ページに続きます \n \n \n5 \n6 \n取込前 \n1 行ずつ選択して対象者を特定してください。", "images": ["images/ワイズマン__p89.png"]}, {"id": "ワイズマン__page90", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 90, "text": "89 \n \n「取込前」列が『可』になっていることを確認し、実行ボタンをクリックします。 \n \n確認メッセージが表示されたら、はいボタンをクリックします。 \n \n \n \n \n \n処理完了のメッセージが表示されたら、OK ボタンをクリックします。 \n \n \n \n「取込後」列に実行結果が表示されます。 \n※ \n取込が完了したファイルは、バックアップ用フォルダに自動で移動されます。詳細は次ペー\nジを参照してください。 \n \n \n \n本操作は以上です。 \n \n \n9 \n取込後 \n・ 『済』・『取込済』以外の場合は、「メディカル介護システム」にケアプランデータのファイルが取り\n込まれていません。患者台帳など必要な情報を登録のうえ、再度CSV ファイルを取り込んでく\nださい。 \n・ 提供票の削除ファイルを取り込むと、対象者に登録済みの予定や限度額は削除されます。但\nし、すでに当月の介護給付費明細書・自費請求書が作成済みの場合は、削除されません。 \n8 \n7", "images": ["images/ワイズマン__p90.png"]}, {"id": "ワイズマン__page91", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 91, "text": "90 \n \n \n 取込を実行したファイルは、バックアップ用フォルダに移動されます。 \n \n \n \n[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面の「取込フォルダ」に保存したケアプ\nランデータのファイルは、取込実行後、下記バックアップ用フォルダに自動で移動されます。 \n \n＜バックアップ用フォルダ＞ ※移動先のフォルダは自動で作成されます。 \n例｜・取込フォルダ｜C:\\ASPWise\\IJI\\ケアプランデータ連携標準仕様\\取込 \n・自事業所  ｜ワイズいわて介護医療院 (事業所番号: 03B0000503) \n・ファイル取込｜2025 年04 月20 日12 時34 分56 秒 \n \nC:\\ (C ドライブ) \n∟\n ASPWise \n∟\n Iji \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 出力 \n∟\n 取込 \n∟ \n ケアプラン_03B0000503_ワイズいわて介護医療院 \n∟\n 2025 年04 月20 日12 時34 分56 秒 \nUPHOSOKU_000000_0300000007_43_03B0000503_16_20250420123456.CSV \nUP1KYO_0300000007_43_03B0000503_16_20250420123456.CSV \nUP2KYO_0300000007_43_03B0000503_16_20250420123456.CSV \n \n \n \n \n \n \n∟\n 202505 予定 \n∟\n 03B0000503_ワイズいわて介護医療院 \nUPHOSOKU_202505_0300000007_43_03B0000503_16_20250520123456.CSV \nUPPLAN_202505_0300000007_43_03B0000503_16_20250520123456.CSV \nUPSIKYU_202505_0300000007_43_03B0000503_16_20250520123456.CSV \n \n \n \n \n \n \n[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面の\n「取込フォルダ」で指定したフォルダ \n提供票用ファイル（例202505 予定 ※サービス提供「2025 年5 月」の場合） \nサービス提供年月ごとのフォルダ内に、事業所番号・事業所名ごとにフォルダを分けて \nファイルが移動されます。 \n※ [介護環境設定(詳細)]／[入院料環境設定]画面の事業所番号・事業所名ご\nとに、フォルダが作成されます。 \n居宅サービス計画書用フォルダ （ケアプラン_事業所番号_事業所名） \n事業所番号・事業所名ごとのフォルダ内に、取込日時ごとにフォルダを分けてファイルが\n移動されます。 \n※ [介護環境設定(詳細)]／[入院料環境設定]画面の事業所番号・事業所名\nごとに、フォルダが作成されます。", "images": ["images/ワイズマン__p91.png"]}, {"id": "ワイズマン__page92", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 92, "text": "91 \nSTEP3 居宅サービス計画書等を表示・印刷する \n \n \n [提供票]－[提供票ファイル取込(ケアプランデータ連携標準仕様)] \n※居宅サービス計画書印刷ボタンから起動。 \nSTEP2 で取り込んだケアプランデータをもとに、｢ケアプラン連携標準仕様｣の居宅サービ\nス計画書等を表示・印刷します。 \n \n \n旧バーションで作成されたケアプランデータは、本機能で表示・印刷できません。 \n \n印刷対象は、以下の帳票です。 \n・ 利用者基本情報 \n・ 居宅サービス計画書(1) \n・ 居宅サービス計画書(2) \n・ 週間サービス計画表 \n・ 介護予防サービス・支援計画書 \n・ 週間サービス計画表 \n \n機能の起動方法 \n \nシステム選択メニューの「メディカル介護（メディカル ファイル連携）」をクリック。 \n※ \nオンプレミス版をご利用の場合は、スタートメニューから[サービス提供票 取込 書込 FD\n／トベッキー]を起動します。 \n \n[ケアマネシステムからの計画入力および実績出力（ファイル連携）]画面上部の \nファイル取込・作成ボタンをクリック。 \n \n表示された画面で [提供票]－[提供票ファイル取込(ケアプランデータ連携標準仕様)]を\n起動。 \n \n \n \n3 \n2", "images": ["images/ワイズマン__p92.png"]}, {"id": "ワイズマン__page93", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 93, "text": "92 \n \n操作 \n居宅サービス計画書等を表示・印刷する \n \n \nSTEP2 で取り込んだケアプランデータをもとに、表示・印刷します。 \n \nSTEP2 で指定した対象年月・取込フォルダを指定します。 \n※ 「V:\\ASPWise\\IJI\\ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様\\取込」など。 \n \n居宅サービス計画書印刷ボタンをクリックします。 \n \n \n \n表示された[居宅サービス計画書印刷]画面で、「事業所番号」からケアプラン作成事業\n所を選択します。 \n \nファイル一覧表示ボタンをクリックします。 \n \n画面上段の一覧に、取込済みの居宅サービス計画書等が表示されます。 \n表示・印刷する行を選択して、ファイル内容表示ボタンをクリックします。 \n \n \n \n画面下段の一覧に、対象利用者が表示されます。表示・印刷する対象者の行に選択のチ\nェック（左列）を付け、表示印刷ボタンをクリックします。 \n \n \n \n次ページに続きます \n \n \n1 \n2 \n3 \n4 \n5 \n5", "images": ["images/ワイズマン__p93.png"]}, {"id": "ワイズマン__page94", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 94, "text": "93 \n \n[表示印刷]画面が表示されます。 \n表示・印刷する帳票種類にチェックを付け、表示または印刷ボタンをクリックします。 \n \n \n \n \n本操作は以上です。 \n \n \n \n \n \n 帳票に出力可能な文字数までが印刷されます。 \n \n \n \n帳票内で文章入力する項目は、帳票の枠内に収まるよう、文字サイズを調整して出力されます。 \n但し、出力可能な文字数を超える場合は、印刷されません。 \n \n例｜帳票「利用者基本情報」の項目「友人・地域との関係」 \n■枠内に収まる場合 \n・ 様式に合わせて、そのまま出力されます。 \n・ 改行により枠から逸脱する場合は、改行を除いて出力されます。 \n・ 改行を除いても枠から逸脱する場合は、文字数に応じて文字サイズを調整して出力されます。 \n \n■枠内に収まらない場合 \n上記の調整後も枠から逸脱する場合は、出力可能な文字数を超える部分が印刷されません。", "images": ["images/ワイズマン__p94.png"]}, {"id": "ワイズマン__page95", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 95, "text": "94 \n \n■ 帳票「利用者基本情報」A4・縦 \n \n \n■ 帳票「居宅サービス計画書 第1 表・第2 表」A4・横 \n \n \n■ 帳票「介護予防サービス・支援計画書」A3・横", "images": ["images/ワイズマン__p95.png"]}, {"id": "ワイズマン__page96", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 96, "text": "95 \nSTEP4 提供票データを登録する \n \n \n \n[メディカル ファイル連携] \n－[ケアマネシステムからの計画入力および実績出力(ファイル連携)] \nSTEP2 で取り込んだケアプランデータをもとに、利用者ごとの提供票データ（予定や限度\n額）を「メディカル介護システム」に登録します。 \n \n \n予定や限度額の登録には、注意点があります。98 ページを参照してください。 \n \n \n操作 \n利用者ごとの予定や限度額を登録する \n \n \n \n[ケアマネシステムからの計画入力および実績出力(ファイル連携)]画面を開きます。 \n※ \nオンプレミス版をご利用の場合は、スタートメニューから[サービス提供票 取込 書込 FD\n／トベッキー]を起動します。 \n \n対象月（サービス提供年月）、支援事業所を選択します。 \n \n機能『取り込み』、アイテム『月間計画＆区分限度額』を選択します。 \n \n表示ボタンをクリックします。 \n \n \n \n \n \n \n※ \n取り込むデータが1 件もない場合、表示ボタンをクリックした際に「最新情報はありません\nでした」のメッセージが表示されます。 \n \n \n \n \n \n \n次ページに続きます \n \n \n「状態」列が 『取込可能』 の場合、計画を取込できます。 \n・ 保険登録｜『×』の場合は、[患者台帳 基本①]画面で介護保険認定情報を登録して \n          ください。 \n・ 開始登録｜『×』の場合は、[居宅サービス開始・中止入力]画面で居宅サービスの開始日を \n          登録してください。", "images": ["images/ワイズマン__p96.png"]}, {"id": "ワイズマン__page97", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 97, "text": "96 \n \n表示された一覧で、計画を取り込む利用者の選択列にチェックを付け、実行ボタンをク\nリックします。 \n \n \n \n確認メッセージが表示されたら、はいボタンをクリックします。 \n \n \n処理が終了したら、「計画取込」列・「状態」列で実行結果を確認します。 \n※ \n正常に取込が終了した場合、状態列に『取込成功』と表示されます。 \n \n \n \n \n本操作は以上です。", "images": ["images/ワイズマン__p97.png"]}, {"id": "ワイズマン__page98", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 98, "text": "97 \n \n \n各機能に反映する内容 \n \n \n \n \n[提供票入力]画面 \n \n \n提供票ファイルで受け取ったサービス提供内容が、予定として登録されます。 \n \n  \n \n \n \n \n[限度額入力]／[限度額一括入力]画面  \n \n \n当月の限度額や、計画作成事業所の情報が登録されます。 \n \n \n「支援専門員」は常に空欄で取り込まれるため、取込後に担当者を入力してください。 \n \nサービス種類が「（予防）居宅療養管理指導」の提供票データを取り込んだ場合、本画面は登録され\nません。 \n \n \n \n摘要欄に「退院（所）年月日又は認定年月日」の記載が必要な以下の\n加算は、前月実績の摘要欄から複写されます。 \n・訪問リハ短期集中リハ加算    ・予防訪問リハ短期集中リハ加算 \n・通所リハ短期集中個別リハ加算", "images": ["images/ワイズマン__p98.png"]}, {"id": "ワイズマン__page99", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 99, "text": "98 \n \n \n \n地域包括支援センターから居宅介護支援事業所に計画作成を委託している利用者は、 \n取込後に、支援事業所を「地域包括支援センター」に訂正してください。 \n \n \n \n「ケアプランデータ連携標準仕様」の提供票ファイルには委託情報が存在しないため、居宅介\n護支援事業所から送付されたファイルを取り込むと、委託利用者の場合も「作成区分：介護予\n防支援事業者作成」・「支援事業所：居宅介護支援事業所」で取り込まれます。 \n \n \n \n \n月途中に保険変更があり、どちらの保険でも同じサービス種類の提供がある場合は、 \n後から取り込んだ提供票ファイルの登録内容が優先されます。 \n \n \n \n一人の利用者に、月内で同じサービス種類・同じ保険情報の提供票データを複数取り込むこと\nはできません。 \n月の途中に保険情報が変わった場合、CSV ファイルを複数回取り込んだ場合は、後から取り込\nんだCSV ファイルの情報で更新されます。 \n前半の保険情報に紐づく予定・限度額は後半の予定・限度額と同じ内容で取り込まれるため、\n[提供票入力]／[限度額入力]画面で取込後にそれぞれ訂正してください。 \n※ 1 つの提供票ファイル内に同一月、同一利用者、同一サービスで保険者の異なる情報が含\nまれていた場合は、CSV ファイルの記載順が早い方の保険情報が優先され、これにひもづ\nく予定が取り込まれます。 \n \n例 ｜ 通所リハを利用中、同月内に保険者変更があり、①→②の順に取り込んだ場合 \n \n \n①通所リハ・保険者A \n \n前半の予定・限度額は取込後\nに訂正。 \n \n \n \n②通所リハ・保険者B \n後半の保険者の予定・限度\n額が取り込まれます。 \n \n \n \n \n同じサービス種類の提供票データを複数回取り込むと上書きされますが、取込済みの \n他のサービスは上書きされません。 \n \n \n \n一人の利用者に、同月の同じサービス種類の提供票データを複数回取り込んだ場合、その内容\nは上書きされます。 \nこのとき、他のサービス種類の提供票データがすでに取込済みの場合は、内容は消去されずそ\nのまま残ります。 \n \n例 ｜ 1 回目に通所リハ・短期入所、2 回目に通所リハのみの提供票データを取り込む場合 \n \n \n①通所リハ \n \n②通所リハ（再取込） \n②で取り込んだ内容に上書き\nされます。 \n \n \n①短期入所 \n \n（取込なし） \n①で取り込んだ短期入所の予\n定・限度額は変更なし。 \n \n \ncsv \ncsv \ncsv \ncsv", "images": ["images/ワイズマン__p99.png"]}, {"id": "ワイズマン__page100", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 100, "text": "99 \nSTEP5 提供実績をファイル出力する \n \nケアマネシステムからの計画入力および実績出力(ファイル連携) \n手順1 \n提供実績を書き出す \n \n \n [メディカル ファイル連携] \n－[ケアマネシステムからの計画入力および実績出力(ファイル連携)] \nケアプラン作成事業所へサービス提供実績を送信するため、本システムで登録したサービ\nス提供実績を書き出し、ファイル出力の準備をします。 \n \n \nあらかじめ、「メディカル介護システム」でサービス提供実績や限度額を登録してください。 \n \n[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面で、ケアプラン作成事業所からの提供票\nファイルを取り込んだ利用者のみ、提供実績ファイルを出力できます。 \n \n \n操作 \n提供実績を書き出す \n \n \n \n[ケアマネシステムからの計画入力および実績出力(ファイル連携)]画面を開きます。 \n※ \nオンプレミス版をご利用の場合は、スタートメニューから[サービス提供票 取込 書込 FD\n／トベッキー]を起動します。 \n \n対象月（サービス提供年月）、支援事業所を選択します。 \n \n機能『書き出し』、アイテム『月間実績』を選択します。 \n \n表示ボタンをクリックします。 \n \n \n \n※ \n書き出すデータが1 件もない場合、表示ボタンをクリックした際に「最新情報はありません\nでした」のメッセージが表示されます。 \n \n \n次ページに続きます \n \n \n計画取込｜『未』の場合は、[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面で \n          提供票ファイルを取り込んでいないため、書き出しできません。", "images": ["images/ワイズマン__p100.png"]}, {"id": "ワイズマン__page101", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 101, "text": "100 \n \n表示された一覧で、実績を書き出す利用者の選択列にチェックを付け、実行ボタンをク\nリックします。 \n \n \n \n確認メッセージが表示されたら、はいボタンをクリックします。 \n \n \n \n処理が終了したら、「実績転送」列・「状態」列で実行結果を確認します。 \n※ \n正常に取込が終了した場合、「状態」列に『実績転送 成功』と表示されます。 \n  \n \n \n本操作は以上です。 \n \n \n \n \n同じサービス種類の提供票データを複数回書き出すと上書きされますが、書き出し済み\nの他のサービスは上書きされません。 \n \n \n \n一人の利用者で、同月の同じサービス種類の提供票データを複数回書き出した場合、その内容\nは上書きされます。 \nこのとき、他のサービス種類の提供票データをすでに書き出し済みの場合は、内容は消去され\nずそのまま残ります。 \n \n例 ｜ 1 回目に通所リハ・短期入所、2 回目に通所リハのみの提供票データを取り込む場合 \n \n \n①通所リハ \n \n②通所リハ（再書き出し） \n②で書き出した内容に上書き\nされます。 \n \n \n①短期入所 \n \n（書き出ししない） \n①で書き出し短期入所の実\n績・限度額は変更なし。 \n \n \ncsv \ncsv", "images": ["images/ワイズマン__p101.png"]}, {"id": "ワイズマン__page102", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 102, "text": "101 \n[提供実績ファイル書込(ケアプランデータ連携標準仕様)]画面 \n手順2 \n提供実績ファイルを出力する \n \n \n [提供票]－[提供実績ファイル書込(ケアプランデータ連携標準仕様)] \nケアプラン作成事業所へ送付するサービス提供実績のCSV ファイルを出力します。 \n \n \n[提供票ファイル取込(ケアプランデータ連携標準仕様)]画面で、ケアプラン作成事業所からの提供票\nファイルを取り込んだ利用者のみ、提供実績ファイルを出力できます。 \n \n本システムでは、ケアプラン作成事業所が実績を削除するための削除ファイル（ファイル名が\n「DLT」から始まるCSV）は出力できません。 \n \n機能の起動方法 \n \nシステム選択メニューの「メディカル介護（メディカル ファイル連携）」をクリック。 \n※ \nオンプレミス版をご利用の場合は、スタートメニューから[サービス提供票 取込 書込 FD\n／トベッキー]を起動します。 \n \n[ケアマネシステムからの計画入力および実績出力（ファイル連携）]画面上部の \nファイル取込・作成ボタンをクリック。 \n \n表示された画面で [提供票]－[提供実績ファイル書込(ケアプランデータ連携標準仕様)]\nを起動。 \n \n \n \n3 \n2", "images": ["images/ワイズマン__p102.png"]}, {"id": "ワイズマン__page103", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 103, "text": "102 \n \n操作 \n提供実績ファイルを出力する \n \n \n \n[提供実績ファイル書込(ケアプランデータ連携標準仕様)]画面を開きます（前ページ参照）。 \n \n対象年月（サービス提供年月）・あらかじめ確認した書込フォルダ（81 ページ参照）を \n指定します。 \n \n事業所表示ボタンをクリックします。 \n \n \n \n \n \n出力するサービス提供実績が、ケアプラン作成事業所・サービスごとに一覧に表示されま\nす。出力する行に選択のチェック（左列）を付け、対象者表示ボタンをクリックします。 \n \n \n \n \nサービス提供実績を出力する利用者が、一覧に表示されます。作成ボタンをクリックします。 \n \n \n \n \n次ページに続きます \n \n \n2 \n3 \nクリックして選択。 \n4 \n5 \n・ フォルダ指定は前回値保持されます。 \n・ ASP サービスをご利用の場合、コンピュータ\nのC ドライブは『V:\\』と表示されます。", "images": ["images/ワイズマン__p103.png"]}, {"id": "ワイズマン__page104", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 104, "text": "103 \n \n確認メッセージが表示されたら、はいボタンをクリックします。 \n \n \n \n処理中の画面が表示され、終了すると「書込結果」列に作成結果が表示されます。 \n※ 『済』以外の場合は、提供実績ファイルが出力されていません。 \n介護保険認定情報やサービス提供実績など必要な情報を登録のうえ、再度CSV ファイルを出\n力してください。 \n \n \n \n \n本操作は以上です。 \n \n \n \n \n 短期入所の30 日超過日の情報について \n \n \n \n「メディカル介護システム」から出力した提供実績ファイルには、[提供票入力]画面で設定し\nた30 日超過日（自費利用となる日）の情報は反映されません。そのため、30 日超過日当日の\n実績は、30 日超過日としてではなく、保険給付対象の実績として出力されます。 \n短期入所の連続利用が自費利用を挟み30 日を超える利用者がいる場合は、必要に応じてケアプ\nラン作成事業所に電話等で30 日超過日について連絡をしてください。 \n \n \n6 \n書込結果 \nファイル出力が正常終了すると『済』が表示。", "images": ["images/ワイズマン__p104.png"]}, {"id": "ワイズマン__page105", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 105, "text": "104 \n \n \n 提供実績ファイルの出力先（出力フォルダ） \n \n \n \n[提供実績ファイル書込(ケアプランデータ連携標準仕様)]画面の「書込フォルダ」で指定したフ\nォルダ（102 ページ参照）に、提供実績ファイルが出力されます。 \n※ 出力時に自動で以下のフォルダが作成されます。 \n \n出力フォルダ \n例｜他法人の居宅介護支援事業所(事業所番号: 0300000007)に送信する提供実績ファイルを、 \n自法人のサービス提供事業所(事業所番号: 03B0000503)で出力した場合 \n  ※出力日時：2025 年06 月01 日12 時34 分56 秒 \n \nC:\\ (C ドライブ) \n∟\n ASPWise \n∟\n Iji \n∟\n ｹｱﾌﾟﾗﾝﾃﾞｰﾀ連携標準仕様 \n∟\n 取込 \n∟\n 出力 \n∟\n 2025 年06 月01 日12 時34 分56 秒 実績 \n∟\n 03B0000503_ワイズいわて介護医療院 \nUPJSK_202505_03B0000503_16_0300000007_43_20250601123456.CSV \nUPJSK_202505_03B0000503_66_0300000007_43_20250601123456.CSV \n \n \n \n \n \n[提供実績ファイル書込(ケアプランデータ連携標準仕様)]画面\nの「書込フォルダ」で指定したフォルダ \n出力日時ごとに、フォルダが分かれます。 \n事業所番号_事業所名 のフォルダ \n※ [介護環境設定(詳細)]／[入院料環境設定]画面の事業所番号・事業所名ごとに、 \nフォルダが作成されます。", "images": ["images/ワイズマン__p105.png"]}, {"id": "ワイズマン__page106", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 106, "text": "105 \nSTEP6 ケアプラン作成事業所に提供実績ファイルを送付する \n \n国保中央会｢ケアプランデータ連携システム｣等を介して、ケアプラン作成事業所に提供実\n績ファイルを送付します。 \n \n \n｢ケアプランデータ連携システム｣を介してデータ送信する場合は、提供実績ファイルを｢ケアプラン\nデータ連携クライアント｣にアップロードして送信してください。 \n \n｢ケアプランデータ連携クライアント｣の操作方法は、国保中央会提供の操作マニュアル等を参照して\nください。ご不明点は、国保中央会にお問い合わせください。 \n \n \n \n \n \n \n送付済みデータを取り下げたい利用者がいる場合は、連携先の事業所に電話等で連絡を\nしてください。 \n \n \n \n｢ケアプランデータ連携標準仕様｣で提示されているファイルレイアウトのうち、｢削除情報ファ\nイル｣の出力には「メディカル介護システム」は対応していません。何らかの理由で送付済みの\n提供実績を取り下げる利用者がいる場合は、ケアプラン作成事業所に電話等で連絡をしてくだ\nさい。 \n \n※ ｢削除情報ファイル｣とは、何らかの理由で送信済みの提供実績を取り下げる場合に送信す\nるファイルです。｢ケアプランデータ連携標準仕様｣では、必ずしも取り下げ時に削除情報\nファイルを送信する必要はなく、取り下げ先の事業所に電話等で連絡し、オフラインで計\n画書の取り下げをする運用も可能とされています。 \n \n \n \n本操作は以上です。", "images": ["images/ワイズマン__p106.png"]}, {"id": "ワイズマン__page107", "software": "ワイズマン", "category": "", "file_name": "ワイズマン.pdf", "page": 107, "text": "106 \n \n運用のポイント｜｢ケアプランデータ連携システム｣を介してデータ送受信をする場合 \n \n国保中央会｢ケアプランデータ連携システム｣を介してデータ送受信する場合の、運用時のポ\nイントは下表の通りです。 \n \n \n｢ケアプランデータ連携クライアント｣のインストール方法・操作方法は、国保中央会提供の操作マニ\nュアル等を参照してください。ご不明点は、国保中央会にお問い合わせください。 \n \n項目 \n説明 \n「ケアプランデ一タ連携クライアント」を \nインストールするPC \nワイズマンシステムを使用しているPC に「ケアプランデ一タ連携クライアント」\nをインストールすると、送信時のファイル添付作業をスムーズに行えます。 \nよく使用するフォルダ \n \n*「ケアプランデ一タ連携クライアント」でファイル \n 送受信するフォルダ \n*ワイズマンシステムでファイル出力・取込する \n フォルダ \nよく使用するフォルダのショートカットを、デスクトップなどの分かりやすい場所に\n作成すると、ファイル選択の操作が簡単になります。 \n取込やファイル選択画面で①デスクトップを選択→②作成したショートカット\nを選択、2 ステップで対象ファイルが表示されるようになります。 \n作成したショートカットは、任意の名前に変更できます。 \n \n■デスクトップにショートカットを作成する方法 \nWindows11 の場合 \n①ショートカットを作成するフォルダを右クリックします。 \n②表示されたメニューで、[その他のオプションを表示]→[送る]→ \n[デスクトップ(ショートカットを作成)]の順にクリックします。 \n③デスクトップにショートカットアイコンが作成されたことを確認します。 \n \nWindows10 の場合 \n①ショートカットを作成するフォルダを右クリックします。 \n②表示されたメニューで、[送る]→[デスクトップ(ショートカットを作成)] \nの順にクリックします。 \n③デスクトップにショートカットアイコンが作成されたことを確認します。", "images": ["images/ワイズマン__p107.png"]}, {"id": "介護ASP__page1", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 1, "text": "（画像マニュアル）", "images": ["images/介護ASP__p1.png"]}, {"id": "介護ASP__page2", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 2, "text": "（画像マニュアル）", "images": ["images/介護ASP__p2.png"]}, {"id": "介護ASP__page3", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 3, "text": "（画像マニュアル）", "images": ["images/介護ASP__p3.png"]}, {"id": "介護ASP__page4", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 4, "text": "（画像マニュアル）", "images": ["images/介護ASP__p4.png"]}, {"id": "介護ASP__page5", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 5, "text": "（画像マニュアル）", "images": ["images/介護ASP__p5.png"]}, {"id": "介護ASP__page6", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 6, "text": "（画像マニュアル）", "images": ["images/介護ASP__p6.png"]}, {"id": "介護ASP__page7", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 7, "text": "（画像マニュアル）", "images": ["images/介護ASP__p7.png"]}, {"id": "介護ASP__page8", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 8, "text": "（画像マニュアル）", "images": ["images/介護ASP__p8.png"]}, {"id": "介護ASP__page9", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 9, "text": "（画像マニュアル）", "images": ["images/介護ASP__p9.png"]}, {"id": "介護ASP__page10", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 10, "text": "（画像マニュアル）", "images": ["images/介護ASP__p10.png"]}, {"id": "介護ASP__page11", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 11, "text": "（画像マニュアル）", "images": ["images/介護ASP__p11.png"]}, {"id": "介護ASP__page12", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 12, "text": "（画像マニュアル）", "images": ["images/介護ASP__p12.png"]}, {"id": "介護ASP__page13", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 13, "text": "（画像マニュアル）", "images": ["images/介護ASP__p13.png"]}, {"id": "介護ASP__page14", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 14, "text": "（画像マニュアル）", "images": ["images/介護ASP__p14.png"]}, {"id": "介護ASP__page15", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 15, "text": "（画像マニュアル）", "images": ["images/介護ASP__p15.png"]}, {"id": "介護ASP__page16", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 16, "text": "（画像マニュアル）", "images": ["images/介護ASP__p16.png"]}, {"id": "介護ASP__page17", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 17, "text": "（画像マニュアル）", "images": ["images/介護ASP__p17.png"]}, {"id": "介護ASP__page18", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 18, "text": "（画像マニュアル）", "images": ["images/介護ASP__p18.png"]}, {"id": "介護ASP__page19", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 19, "text": "（画像マニュアル）", "images": ["images/介護ASP__p19.png"]}, {"id": "介護ASP__page20", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 20, "text": "（画像マニュアル）", "images": ["images/介護ASP__p20.png"]}, {"id": "介護ASP__page21", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 21, "text": "（画像マニュアル）", "images": ["images/介護ASP__p21.png"]}, {"id": "介護ASP__page22", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 22, "text": "（画像マニュアル）", "images": ["images/介護ASP__p22.png"]}, {"id": "介護ASP__page23", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 23, "text": "（画像マニュアル）", "images": ["images/介護ASP__p23.png"]}, {"id": "介護ASP__page24", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 24, "text": "（画像マニュアル）", "images": ["images/介護ASP__p24.png"]}, {"id": "介護ASP__page25", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 25, "text": "（画像マニュアル）", "images": ["images/介護ASP__p25.png"]}, {"id": "介護ASP__page26", "software": "介護ASP", "category": "", "file_name": "介護ASP.pdf", "page": 26, "text": "（画像マニュアル）", "images": ["images/介護ASP__p26.png"]}, {"id": "楽にネット__page1", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 1, "text": "ケアプランデータ連携CSV 取り込みマニュアル \n \n1. メニューの変更について \n2. 利用者基本情報 \n3. 予防サービス支援計画書 \n4. ケアプランデータ連携CSV ファイルの出力 \n5. ケアプランデータ連携実績データの取り込み \n6. 取込結果の確認・反映 \n7. 地域包括支援センターからのCSV 取り込み", "images": ["images/楽にネット__p1.png"]}, {"id": "楽にネット__page2", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 2, "text": "1. メニューの変更について \nケアプランデータ連携画面への遷移及び利用者の個別画面について画面の遷移方法が\n変更となっています。 \n・ケアプランデータ連携画面 \n \n「ケアプランデータ連携」をクリックするとサブメニューが表示されます。", "images": ["images/楽にネット__p2.png"]}, {"id": "楽にネット__page3", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 3, "text": "「データ出力」・・・ケアプランデータ連携システムのCSV を作成します \n「実績データの取り込み」・・・サービス事業所からの実績CSV を取り込みます \n「地域包括支援センターからの取り込み」・・・地域包括支援センターからのケアプラン、\n計画書CSV を取り込みます \n「データ移行用」・・・利用者情報を他ソフトより取り込みます。（他ソフトがケアプラン\nデータ連携に対応している場合）", "images": ["images/楽にネット__p3.png"]}, {"id": "楽にネット__page4", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 4, "text": "2. 利用者基本情報 \nケアプランデータ連携に対応した利用者基本情報画面を追加しました。 \nこちらの画面で作成した要支援者のデータは、「データ出力」機能でケアプランデータ連携\nシステム用のCSV を作成することができます。 \n \n \n・「アセスメント・モニタリング」メニューの変更 \n画面の追加に伴い、メニューの位置が変更になりました。 \n新しい利用者基本情報画面は「利用者基本情報(連)」、 \n現行の利用者基本情報画面は「利用者基本情報(旧)」から遷移できます。 \n（要介護 旧メニュー） \n \n（要介護 新メニュー）", "images": ["images/楽にネット__p4.png"]}, {"id": "楽にネット__page5", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 5, "text": "（要支援 旧メニュー） \n \n（要支援 新メニュー）", "images": ["images/楽にネット__p5.png"]}, {"id": "楽にネット__page6", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 6, "text": "3. 予防サービス支援計画書 \nケアプランデータ連携に対応した予防サービス支援計画書画面を追加しました。 \nこちらの画面で作成したデータは、「データ出力」機能でケアプランデータ連携システム用\nのCSV を作成することができます。 \n \n \n・「介護予防支援」メニューの変更 \n画面の追加に伴い、メニューの位置が変更になりました。 \n新しい予防サービス支援計画書画面は「予防サービス支援計画書」から遷移できます。 \n「予防サービス支援計画書1」、「予防サービス支援計画書2」、「予防サービス支援計画書3」\nは3 行目に移動になりました。 \n（要支援 旧メニュー） \n \n（要支援 新メニュー）", "images": ["images/楽にネット__p6.png"]}, {"id": "楽にネット__page7", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 7, "text": "4. ケアプランデータ連携CSV ファイルの出力 \nメインメニューの「ケアプランデータ連携」のサブメニューから「データ出力」をクリッ\nクします。 \n \n利用者が表示されない場合は、対象年月のケアプランを確定することで、利用者が選択可\n能になります。", "images": ["images/楽にネット__p7.png"]}, {"id": "楽にネット__page8", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 8, "text": "出力したい利用者と出力内容を選択し、CSV 出力ボタンをクリックします。 \n※「作成フォルダのクリア」をチェックして出力すると、フォルダ内のファイルを全て削\n除してからCSV が出力されます。フォルダ内のファイルを使用している場合は削除できま\nせん。 \n \nCSV 出力ダイアログが表示されます。 \n提供時間を1 分減らしたい場合（9:00-10:00 の場合09:00-9:59 となります）該当サービス\nにチェックをつけます。 \n月あたりの加算サービスを初日のみ出力したい場合はチェックをつけます。 \n出力ボタンをクリックします。", "images": ["images/楽にネット__p8.png"]}, {"id": "楽にネット__page9", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 9, "text": "フォルダーの参照ダイアログが表示されます。 \n出力するフォルダーを選択するか、新しいフォルダーを作成して選択し、OK ボタンをクリ\nックします。 \n \n指定のフォルダーにCSV が出力されました。", "images": ["images/楽にネット__p9.png"]}, {"id": "楽にネット__page10", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 10, "text": "＜地域包括支援センター用のCSV を出力する場合＞ \n「地域包括支援センターへ出力」にチェックを入れます。 \n出力したい利用者と出力内容を選択し、CSV 出力ボタンをクリックします。 \n \nCSV 出力ダイアログが表示されます。 \n提供時間を1 分減らしたい場合（9:00-10:00 の場合09:00-9:59 となります）該当サービス\nにチェックをつけます。 \n月あたりの加算サービスを初日のみ出力したい場合はチェックをつけます。 \nケアプランのデータを実績で出力したい場合はチェックをつけます。 \n出力ボタンをクリックします。", "images": ["images/楽にネット__p10.png"]}, {"id": "楽にネット__page11", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 11, "text": "5. ケアプランデータ連携実績データの取り込み \nメインメニューの「ケアプランデータ連携」のサブメニューから「実績データの取り込み」\nをクリックします。 \n \nCSV 読み込みボタンをクリックします。", "images": ["images/楽にネット__p11.png"]}, {"id": "楽にネット__page12", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 12, "text": "フォルダーの参照ダイアログが表示されます。 \n対象のCSV を格納しているフォルダを選択し、OK ボタンをクリックします。 \n \nファイルが読み込まれ、利用者の一覧が表示されます。", "images": ["images/楽にネット__p12.png"]}, {"id": "楽にネット__page13", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 13, "text": "取り込みたい利用者を選択し、実績データ取り込みボタンをクリックします。 \n※ 対象年月のケアプランが確定されていて、「取込」の列に可が表示されているデータの\nみ取り込むことができます。 \n※ 実績データの取り込み時点では、取込内容はケアプランに反映されていません。 \n※ ケアプランに反映したい場合は、後述の 6.取込結果の確認・反映をご確認ください。", "images": ["images/楽にネット__p13.png"]}, {"id": "楽にネット__page14", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 14, "text": "6. 取込結果の確認・反映 \n「サービス事業所からの取込結果」をクリックし、取込結果画面に移動します。 \n \nデータをダブルクリックすると詳細画面が表示されます。", "images": ["images/楽にネット__p14.png"]}, {"id": "楽にネット__page15", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 15, "text": "取込内容に問題がなければ、ケアプランに反映ボタンをクリックします。 \n（事業所からの実績をケアプランに反映し、ケアプランと実績を一致させます） \n \n取込内容がケアプランに反映されました。", "images": ["images/楽にネット__p15.png"]}, {"id": "楽にネット__page16", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 16, "text": "7. 地域包括支援センターからのCSV 取り込み \nメインメニューの「ケアプランデータ連携」のサブメニューから「地域包括支援センター\nからの取り込み」をクリックします。 \n \n① CSV ファイルの読み込み \nCSV 読み込みボタンをクリックします。", "images": ["images/楽にネット__p16.png"]}, {"id": "楽にネット__page17", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 17, "text": "フォルダーの参照ダイアログが表示されます。 \n対象のCSV を格納しているフォルダを選択し、OK ボタンをクリックします。 \n \nファイルが読み込まれ、利用者の一覧が表示されます。 \n登録されていない利用者は、利用者ID が「新規データ」と表示されます。", "images": ["images/楽にネット__p17.png"]}, {"id": "楽にネット__page18", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 18, "text": "② 利用者情報・介護保険情報確認 \nCSV チェックリストボタンをクリックすると、システムに登録されている利用者情報・介\n護保険情報とCSV の内容の比較ができます。", "images": ["images/楽にネット__p18.png"]}, {"id": "楽にネット__page19", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 19, "text": "③ 新規利用者の登録 \n利用者ID が「新規データ」の利用者を選択し、利用者登録ボタンをクリックすると、新規\n利用者として登録することができます。 \n \n利用者が登録されて、利用者ID が割り振られました。", "images": ["images/楽にネット__p19.png"]}, {"id": "楽にネット__page20", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 20, "text": "④ 計画書の取り込み \n利用者を選択して、計画書取り込みボタンをクリックします。 \n \n取り込みが完了すると、「より高い支援」メニューの「利用者基本情報(包括)」、「予防支援\n計画書(包括)」で内容を確認できます。", "images": ["images/楽にネット__p20.png"]}, {"id": "楽にネット__page21", "software": "楽にネット", "category": "", "file_name": "楽にネット.pdf", "page": 21, "text": "利用者基本情報(包括) \n \n \n予防支援計画書(包括)", "images": ["images/楽にネット__p21.png"]}, {"id": "絆マニュアル__page1", "software": "絆マニュアル", "category": "", "file_name": "絆マニュアル（地域包括）.pdf", "page": 1, "text": "（画像マニュアル）", "images": ["images/絆マニュアル__p1.png"]}, {"id": "絆マニュアル__page2", "software": "絆マニュアル", "category": "", "file_name": "絆マニュアル（地域包括）.pdf", "page": 2, "text": "（画像マニュアル）", "images": ["images/絆マニュアル__p2.png"]}, {"id": "絆マニュアル__page3", "software": "絆マニュアル", "category": "", "file_name": "絆マニュアル（地域包括）.pdf", "page": 3, "text": "（画像マニュアル）", "images": ["images/絆マニュアル__p3.png"]}, {"id": "絆マニュアル__page4", "software": "絆マニュアル", "category": "", "file_name": "絆マニュアル（地域包括）.pdf", "page": 4, "text": "（画像マニュアル）", "images": ["images/絆マニュアル__p4.png"]}, {"id": "絆マニュアル__page5", "software": "絆マニュアル", "category": "", "file_name": "絆マニュアル（地域包括）.pdf", "page": 5, "text": "（画像マニュアル）", "images": ["images/絆マニュアル__p5.png"]}, {"id": "絆マニュアル__page6", "software": "絆マニュアル", "category": "", "file_name": "絆マニュアル（地域包括）.pdf", "page": 6, "text": "（画像マニュアル）", "images": ["images/絆マニュアル__p6.png"]}, {"id": "絆マニュアル__page7", "software": "絆マニュアル", "category": "", "file_name": "絆マニュアル ................................ 15 \nイ）居宅介護支援事業所、地域包括支援センターから受け取ったケアプランを取込する......... 16 \nロ）居宅介護支援事業所、地域包括支援センターから受け取ったケアプランの内容を確認する ... 22 \nハ）実績を出力する .................................................................... 24 \nIV. \n補足................................................................................... 28 \n \n \n※ 本書には、異なるシステム（サービス種）の画面を用いて説明している箇所があります。 \nお使いのシステムやサービス種に読み替えてご覧ください。 \n \nケアプランデータ連携（サービス提供事業所システム版） \n＜操作説明書＞", "images": ["images/ラベンダー__p1.png"]}, {"id": "ラベンダー__page2", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 2, "text": "Copyright (C) 2026 conduct Corporation                                               page 2/32 \nI. （１）システムの対応について \nFlowersNEXT では、以下の情報のＣＳＶファイルの出力・取込に対応しています。 \n■ 取込 ･･･ 居宅サービス計画書(１)(２)(３)※  \n介護予防サービス支援計画表、利用者基本情報※ \nサービス提供票・別表 \n※居宅サービス計画書(３)、介護予防サービス支援計画表、利用者基本情報は印刷のみ対応 \n■ 出力 ･･･ 実績 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n取込イメージ \n※取込対象は、5 ページをご確認ください。 \n \n【サービス提供事業所】 \n \nサービス計画※ \n保険請求予定 \nFlowersNEXT \nＣＳＶ \nファイル \n \n【居宅介護支援事業所】 \nＣＳＶ \nファイル \n・居宅サービス計画書(１)(２)(３) \n \n・サービス提供票・別表 \n \n・利用者補足情報 \n \n【地域包括支援センター】\nＣＳＶ \nファイル \n \n・サービス提供票・別表 \n・利用者補足情報 \n \n【ケアプラン提供】 \n出力イメージ \n \n【居宅介護支援事業所】\nＣＳＶ \nファイル \n \n【地域包括支援センター】\nＣＳＶ \nファイル \n \n【サービス提供事業所】\nFlowersNEXT \nＣＳＶファイル出力 \n保険請求実績 \nＣＳＶ \nファイル \n・実績 \n \n【実績報告】", "images": ["images/ラベンダー__p2.png"]}, {"id": "ラベンダー__page3", "software": "ラベンダー", "category": "", "file_name": "ラベンダー.pdf", "page": 3, "text": "Copyright (C) 2026 conduct Corporation                                               page 3/32 \n（２）ＣＳＶファイルについて \n＜ＣＳＶファイルの出力＞ \n居宅介護支援事業所、地域包括支援センターごとに、一つのファイルにまとまります。 \n \n \n \n \n \n \n \n \n \n \n \n \n＜出力されるＣＳＶファイルの種類＞ \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n実績 \n・保険請求実績情報 \n・削除情報※ \n \n※ 「削除情報」は、「削除ファイルを出力する」（12 ページ）にチェックがあり、ＣＳＶファイルの \n出力後に保険請求実績を削除した場合のみ出力されます。 \n \n居宅介護支援事業所X \n利用者A \n居宅介護支援事業所Y \n利用者B \n利用者C \n居宅介護支援事業所X \n利用者D \n \nＣＳＶ \nファイル \n居宅介護支援事業所X \n利用
